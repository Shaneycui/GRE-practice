<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>后续题目原页</title><style>body{margin:0;background:#f4f7f3;color:#23382a;font:16px system-ui,sans-serif}header{background:#233d2b;color:white;padding:18px 5%}main{max-width:980px;margin:auto;padding:20px}button,input{font:inherit;padding:10px;border:1px solid #b9cdbd;border-radius:8px;background:white}.tools{display:flex;align-items:center;flex-wrap:wrap;gap:8px}.note{line-height:1.6;background:#edf4ec;padding:14px;border-radius:8px}img{display:block;width:100%;height:auto;background:white;border:1px solid #dce8df;margin:16px auto}a{color:#285d38}</style></head><body><header><b>GRE 填空练习 · 后续题目原页</b></header><main><p><a href="sections.html">← 返回 Section 练习</a></p><p class="note">这里可以浏览 PDF 中第 85–419 页的原题扫描，包含 Section 36 起的后续内容。当前仅供阅读，尚不能按 Section 选择或在此批改，也没有逐题解析。</p><div class="tools"><button id="prev">上一页</button><label>PDF 页码 <input id="page" type="number" min="85" max="419" value="85" style="width:75px"></label><button id="go">跳转</button><button id="next">下一页</button></div><img id="image" alt="题目原书扫描页"><div class="tools"><button id="prev2">上一页</button><button id="next2">下一页</button></div></main><script>let page=85;const input=document.querySelector('#page');function show(){input.value=page;document.querySelector('#image').src=`pages/p-${String(page).padStart(3,'0')}.jpg`;document.querySelector('#image').alt=`PDF 第 ${page} 页`;document.querySelectorAll('#prev,#prev2').forEach(x=>x.disabled=page===85);document.querySelectorAll('#next,#next2').forEach(x=>x.disabled=page===419)}function step(x){page=Math.max(85,Math.min(419,page+x));show();window.scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('#prev,#prev2').forEach(x=>x.onclick=()=>step(-1));document.querySelectorAll('#next,#next2').forEach(x=>x.onclick=()=>step(1));document.querySelector('#go').onclick=()=>{let n=Number(input.value);if(!Number.isInteger(n)||n<85||n>419){alert('请输入 85 到 419 的整数页码');return}page=n;show()};show();</script></body></html>
