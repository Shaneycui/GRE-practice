<script>const bank=window.GRE_BANK, source=window.GRE_SOURCE?.sections||[], answerBank=window.GRE_ANSWERS, $=s=>document.querySelector(s);
const escapeHTML=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const progressKey=key=>(window.GRE_STORAGE_PREFIX||'')+key;
let storageAvailable=true;
let browserDatabase=null,browserWriteQueue=Promise.resolve(),browserRevision=0,browserPending=0,browserSyncSaved=0,browserLoadIssues=[];
window.GRE_READY=false;
const read=(key,fallback)=>{let raw;if(window.GRE_BACKEND&&window.GRE_SERVER_PROGRESS){const field={'gre-sec1-v1':'section1','gre-sections-2-35-v1':'sections','gre-error-causes-v1':'causes'}[key];if(field){const value=window.GRE_SERVER_PROGRESS[field];try{return (typeof value==='string'?JSON.parse(value):value)||fallback}catch{return fallback}}}try{raw=localStorage.getItem(progressKey(key))}catch{storageAvailable=false;return fallback}try{return JSON.parse(raw)||fallback}catch{return fallback}};
let records=read('gre-sections-2-35-v1',{}), first=read('gre-sec1-v1',{}), causes=read('gre-error-causes-v1',{}), current=0, filter='全部', typeFilter='全部题型';
let recordFileHandle=null,recordFileQueue=Promise.resolve(),recordFilePending=0,recordFileFailed=false,previousImport=null;
const reviewed=n=>n===1||!!bank['section'+n];
const questions=n=>n===1?bank.section1Questions:bank['section'+n]||source.find(s=>s.id===n)?.questions||null;
const letters=(n,i)=>answerBank.sections[n-1].answers[i].split('');
const kind=(n,i)=>answerBank.sections[n-1].kinds[i];
function state(n){if(n===1)return first;return records[n]??={answers:Array.from({length:7},()=>[]),submitted:false,firstScore:null,favorites:[],attempts:[]}}
function favorites(n){return state(n).favorites||[]}
function answers(n,i){const s=state(n);return n===1?(s.sel?.[i]||[]).flat():s.answers?.[i]||[]}
function correct(n,i){return answers(n,i).slice().sort().join('')===letters(n,i).sort().join('')}
function groups(n,i){const q=questions(n)[i];if(n===1)return q.g;const choices=reviewed(n)?q.o:null;const sets=kind(n,i)==='multi'?['ABC','DEF','GHI'].slice(0,letters(n,i).length):[kind(n,i)==='single'?'ABCDE':'ABCDEF'];return sets.map(set=>[...set].map(a=>choices?.find(o=>o[0]===a)||a))}
function needed(n,i){return kind(n,i)==='equivalent'?2:1}
function complete(n,i){return groups(n,i).every(g=>answers(n,i).filter(a=>g.some(o=>o[0]===a)).length===needed(n,i))}
function save(){
 if(window.GRE_BROWSER_STORE&&!window.GRE_BACKEND){saveBrowserProgress();return}
 try{localStorage.setItem(progressKey('gre-sec1-v1'),JSON.stringify(first));localStorage.setItem(progressKey('gre-sections-2-35-v1'),JSON.stringify(records));localStorage.setItem(progressKey('gre-error-causes-v1'),JSON.stringify(causes));storageAvailable=true;$('#storageNotice')?.remove();$('#status').textContent='已自动保存至当前浏览器；更新前请另存记录'}catch{storageAvailable=false;$('#status').textContent='浏览器未能保存记录，请先下载记录备份或保存带记录的网页';if(!recordFileHandle)showStorageNotice()}
 if(recordFileHandle)queueRecordFileSave()
}
function go(route){location.hash=route;render();window.scrollTo(0,0)}
function tags(n,i){let id=`${n}-${i}`,v=causes[id]||[];return `<div class="tags"><span>错因归类</span>${['单词不会','句法错误'].map(t=>`<button data-cause="${id}" data-tag="${t}" aria-pressed="${v.includes(t)}">${t}</button>`).join('')}<small>${v.length?'可同时标记两种原因':'待归类 · 请根据复盘自行判断'}</small></div>`}
function explanation(n,i,collapsed=false,snapshot=null){
 const q=questions(n)?.[i];
 const content=`<p>你的答案：${(snapshot?.answers||answers(n,i)).slice().sort().join(' / ')||'未作答'}　正确答案：<b>${(snapshot?.reference||letters(n,i)).slice().sort().join(' / ')}</b></p><small>答案来源：配套答案表</small>${q?.translation?`<h4>中文翻译</h4><p>${escapeHTML(q.translation)}</p><h4>长难句拆解</h4><p>${escapeHTML(q.grammar)}</p><h4>解题思路</h4><p>${escapeHTML(q.reason||q.e)}</p>`:'<p class="muted">本题中文翻译、长难句拆解和解题思路尚未补齐。</p>'}`;
 const causeTags=favorites(n).includes(i)?tags(n,i):'';
 return collapsed?`<details class="review-disclosure"><summary>答案与复盘</summary><div class="explanation">${content}</div></details>${causeTags}`:`<div class="explanation"><h3>答案与复盘</h3>${content}${causeTags}</div>`
}
function sourceImages(n,pages){return pages.map(p=>`<figure class="source-page"><img loading="lazy" width="1097" height="1550" src="pages/p-${String(p).padStart(3,'0')}.jpg" alt="Section ${n} 原书 PDF 第 ${p} 页"><figcaption>PDF 第 ${p} 页 · <a href="pages/p-${String(p).padStart(3,'0')}.jpg" target="_blank" rel="noopener">打开大图</a></figcaption></figure>`).join('')}
function question(n,i,review=false,attempt=null){let q=questions(n)?.[i],s=attempt?{submitted:true}:state(n),passed=attempt?attempt.correct[i]:correct(n,i);return `<article class="card ${reviewed(n)?'':'answer-card'}" id="${review?'fav'+n+'-':''}q${i}"><div class="eyebrow">SECTION ${String(n).padStart(2,'0')} / QUESTION ${i+1}${review?` · ${questionType(n,i)}`:''}${s.submitted?` <span class="${passed?'good':'bad'}">${passed?'✓ 正确':'× 需复习'}</span>`:''}</div>${reviewed(n)?`<p class="sentence">${escapeHTML(q.t)}</p>`:`<p>第 ${i+1} 题${q.sourceNumber!==i+1?`（原书标号 ${q.sourceNumber}）`:''} · ${kind(n,i)==='equivalent'?'句子等价题，选择两个':kind(n,i)==='multi'?letters(n,i).length+' 空填空题':'单空填空题'}</p><small>请对照${review?'下方':'原书区域的'}题目作答，题目以扫描原页为准。</small>${review||attempt?`<details><summary>查看原题</summary>${sourceImages(n,q.pages)}</details>`:''}`}${q&&!review&&!attempt?`<div class="options">${groups(n,i).map((g,j)=>`<fieldset><legend>${needed(n,i)===2?'选择两个答案':groups(n,i).length>1?'空 '+(j+1):'选择一个答案'}</legend>${g.map(o=>`<label class="option"><input type="${needed(n,i)===2?'checkbox':'radio'}" name="q${i}g${j}" data-i="${i}" data-j="${j}" value="${o[0]}" ${answers(n,i).includes(o[0])?'checked':''} ${s.submitted?'disabled':''}><span>${escapeHTML(o)}</span></label>`).join('')}</fieldset>`).join('')}</div>`:''}${s.submitted||review?explanation(n,i,review||!!attempt,attempt?{answers:attempt.answers[i],reference:attempt.referenceAnswers[i]}:null):''}${review?`<div class="tools"><button data-open="${n}">打开所在 Section</button><button data-remove="${n}-${i}">移出收藏</button></div>`:''}</article>`}
function latestAttempt(n){const s=state(n),list=s.attempts||[],dated=list.filter(a=>a.submittedAt).sort((a,b)=>b.submittedAt.localeCompare(a.submittedAt));return dated[0]||list.find(a=>a.id===s.latestAttemptId)||list[list.length-1]||null}
function mistakeBadge(n){const last=latestAttempt(n),count=last?7-last.score:null;return `<span class="unit-mistakes ${count===null?'mistakes-pending':count===0?'mistakes-clear':'mistakes-found'}"><span>最近错题</span><b>${count===null?'—':count}<small> / 7</small></b></span>`}
function previewHome(){
 const units=Array.from({length:40},(_,i)=>i+1),completed=units.filter(n=>state(n).submitted).length,favoriteCount=units.reduce((sum,n)=>sum+favorites(n).length,0);
 return `<section class="preview-hero"><div><div class="eyebrow">A LITTLE PRACTICE, A CLEARER MIND.</div><h1>先认真做题，<br>再把每一题弄懂<span class="title-dot">。</span></h1><p class="hero-description">为 GRE 填空留一段专注时间。<br>独立完成一个 Section，再一起核对答案、读懂句子。</p><div class="hero-actions"><button class="primary" data-section="1">从 Section 01 开始 <span aria-hidden="true">↗</span></button><a class="text-link" href="#sample">看看交卷后的解析 <span aria-hidden="true">→</span></a></div></div><aside class="study-note"><div class="note-top"><span>YOUR STUDY SPACE</span><span class="note-symbol" aria-hidden="true">✳</span></div><p class="note-caption">每一次复盘，<br>都更接近读懂。</p><div class="note-rule"></div><div class="note-stat"><div><strong>${String(completed).padStart(2,'0')}<small> / 40</small></strong><span>已完成 Section</span></div><div><strong>${String(favoriteCount).padStart(2,'0')}</strong><span>待复习错题</span></div></div><div class="note-foot"><span class="tiny-dot"></span> 一组一组来，不着急。</div></aside></section><div class="workflow-strip"><span><b>01</b> 独立作答</span><i aria-hidden="true">→</i><span><b>02</b> 整组对答案</span><i aria-hidden="true">→</i><span><b>03</b> 中文解析 · 错因复盘</span></div><section class="preview-practice"><div class="section-heading"><div><div class="eyebrow">CHOOSE YOUR SECTION</div><h2>今天，从哪一组开始？</h2></div><span class="section-meta">40 个独立单元 <span>·</span> 共 280 题</span></div><div class="preview-section-grid">${units.map(n=>{const s=state(n),done=Array.from({length:7},(_,i)=>complete(n,i)).filter(Boolean).length;return `<button class="section-card preview-unit ${s.submitted?'unit-complete':''}" data-section="${n}"><div class="unit-top"><span>SECTION</span><span class="unit-arrow" aria-hidden="true">↗</span></div><div class="unit-heading"><strong class="unit-number">${String(n).padStart(2,'0')}</strong>${mistakeBadge(n)}</div><span class="unit-description">7 道填空与等价题<br>${n<=12?'含中文翻译 · 长难句解析':'文字题目 · 整组批改'}</span><div class="unit-progress"><div style="width:${done/7*100}%"></div></div><div class  }catch(error){setRecordFileStatus(recordFileHandle?'保留与 '+recordFileHandle.name+' 的连接':'未能连接记录文件，请使用 JSON 导入或本地自动存档版。','error');showMessage(error.name==='AbortError'?'已取消选择，未连接新的记录文件。':'文件窗口未能打开或授权失败：'+(error.message||error.name))}
}
function initializeRecordFileTools(){
 const panel=$('#recordFilePanel');if(!panel)return;if(window.GRE_BROWSER_STORE&&!window.GRE_BACKEND){panel.hidden=true;return}
 if(window.GRE_BACKEND){
  panel.hidden=false;if($('#browserSavePanel'))$('#browserSavePanel').hidden=true;  recordFileHandle={name:'本机练习记录',createWritable:async()=>{let content='';return {write:async text=>{content=text},close:async()=>{const response=await fetch('/api/progress',{method:'PUT',headers:{'Content-Type':'application/json','X-GRE-Token':window.GRE_SERVER_TOKEN},body:content});if(!response.ok)throw Error('本机记录文件写入失败：'+response.status)},abort:async()=>{}}}};
  panel.querySelectorAll('[data-record-file]').forEach(b=>b.remove());panel.querySelector('small').textContent='每轮成绩、答案与错题自动存入本机；关闭网页或更新程序后可继续。';
  const button=panel.querySelector('[data-save-record-file]');button.disabled=false;button.onclick=()=>queueRecordFileSave();setRecordFileStatus('已连接本机存档。作答与每次交卷都会自动保存。','saved');$('#storageNotice')?.remove();return
 }
 panel.querySelectorAll('[data-record-file]').forEach(button=>{button.disabled=!recordFileSupported();button.onclick=()=>connectRecordFile(button.dataset.recordFile==='new')});
 const saveButton=panel.querySelector('[data-save-record-file]');saveButton.onclick=()=>queueRecordFileSave();
 if(!recordFileSupported())setRecordFileStatus('当前打开方式不支持记录文件连接；请使用 Chrome 普通窗口，或保存带记录的网页。','unsupported');
 else setRecordFileStatus('尚未连接。首次新建一个记录文件；以后打开网页时连接同一个文件。','idle')
}
window.addEventListener('beforeunload',event=>{if(recordFilePending||recordFileFailed){event.preventDefault();event.returnValue=''}});
function openBrowserDatabase(){
 if(browserDatabase)return browserDatabase;
 browserDatabase=new Promise((resolve,reject)=>{if(!window.indexedDB){reject(Error('IndexedDB 不可用'));return}let settled=false;const timer=setTimeout(()=>{if(!settled){settled=true;reject(Error('浏览器记录读取超时'))}},2000);let request;try{request=indexedDB.open(progressKey('gre-practice-browser'),1)}catch(error){clearTimeout(timer);reject(error);return}request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains('records'))request.result.createObjectStore('records')};request.onsuccess=()=>{clearTimeout(timer);if(settled){request.result.close();return}settled=true;resolve(request.result)};request.onerror=()=>{clearTimeout(timer);settled=true;reject(request.error)};request.onblocked=()=>{clearTimeout(timer);settled=true;reject(Error('浏览器记录被其他页面占用'))}});return browserDatabase
}
async function readBrowserDatabase(){const db=await openBrowserDatabase();return new Promise((resolve,reject)=>{const tx=db.transaction('records','readonly'),request=tx.objectStore('records').get('progress');request.onsuccess=()=>resolve(request.result||null);request.onerror=()=>reject(request.error);tx.onabort=()=>reject(tx.error)})}
async function writeBrowserDatabase(serialized){const db=await openBrowserDatabase();await new Promise((resolve,reject)=>{let tx;try{tx=db.transaction('records','readwrite',{durability:'strict'})}catch{tx=db.transaction('records','readwrite')}tx.objectStore('records').put(serialized,'progress');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)});if(await readBrowserDatabase()!==serialized)throw Error('浏览器记录写入校验失败')}
function setBrowserSaveStatus(text,state){const el=$('#browserSaveStatus');if(el){el.textContent=text;el.dataset.state=state}}
function markBrowserSaved(snapshot,revision){if(revision!==browserRevision)return;storageAvailable=true;$('#storageNotice')?.remove();const text=(hasProgress(snapshot)?'已保存本轮作答到本浏览器 · ':'尚未作答 · ')+new Date(snapshot.savedAt).toLocaleTimeString();$('#status').textContent=text;setBrowserSaveStatus(text,'saved')}
function saveBrowserProgress(){
 const revision=++browserRevision,snapshot={...progressSnapshot(),savedAt:new Date().toISOString(),sequence:revision},serialized=JSON.stringify(snapshot);let synchronous=false;
 try{const previous=localStorage.getItem(progressKey('gre-progress-v2'));if(previous){try{const value=JSON.parse(previous);validateProgress(value);if(hasProgress(value))localStorage.setItem(progressKey('gre-progress-last-good-v2'),previous)}catch{}}localStorage.setItem(progressKey('gre-progress-v2'),serialized);if(localStorage.getItem(progressKey('gre-progress-v2'))!==serialized)throw Error('写入未保留');synchronous=true;browserSyncSaved=revision;markBrowserSaved(snapshot,revision)}catch{setBrowserSaveStatus('正在保存到浏览器…','pending')}
 // Preserve the old keys for compatibility. A failure here does not invalidate the verified canonical snapshot.
 try{localStorage.setItem(progressKey('gre-sec1-v1'),JSON.stringify(first));localStorage.setItem(progressKey('gre-sections-2-35-v1'),JSON.stringify(records));localStorage.setItem(progressKey('gre-error-causes-v1'),JSON.stringify(causes))}catch{}
 browserPending++;browserWriteQueue=browserWriteQueue.catch(()=>{}).then(async()=>{try{await writeBrowserDatabase(serialized);markBrowserSaved(snapshot,revision);return true}catch{if(!synchronous&&revision===browserRevision){storageAvailable=false;setBrowserSaveStatus('浏览器未能保存，请先下载记录备份再关闭。','error');$('#status').textContent='记录尚未保存，请下载记录备份';showStorageNotice()}return false}finally{browserPending--}})
}
async function loadBrowserProgress(){
 const candidates=[];
 for(const key of ['gre-progress-v2','gre-progress-last-good-v2'])try{const raw=localStorage.getItem(progressKey(key));if(raw){try{const value=JSON.parse(raw);validateProgress(value);candidates.push(value)}catch(error){browserLoadIssues.push('浏览器记录读取失败：'+error.message)}}}catch{}
 try{const raw=await readBrowserDatabase();if(raw){try{const value=JSON.parse(raw);validateProgress(value);candidates.push(value)}catch(error){browserLoadIssues.push('浏览器备份读取失败：'+error.message)}}}catch{}
 // An empty startup snapshot must never take precedence over real practice records.
 candidates.sort((a,b)=>Number(hasProgress(b))-Number(hasProgress(a))||(b.savedAt||'').localeCompare(a.savedAt||'')||(b.sequence||0)-(a.sequence||0));
 if(candidates.length){const value=candidates[0],parsed=validateProgress(value);first=parsed.section1;records=parsed.sections;causes=parsed.causes;browserRevision=value.sequence||0;storageAvailable=true;
  if(hasProgress(value)){const rounds=(first.attempts||[]).length+Object.values(records).reduce((sum,s)=>sum+(s.attempts||[]).length,0);setBrowserSaveStatus('已恢复本浏览器记录 · '+rounds+' 轮交卷记录','saved')}
  else setBrowserSaveStatus('当前打开位置没有找到已有练习记录','ready')
 }else if(browserLoadIssues.length){setBrowserSaveStatus('旧记录读取失败，未覆盖原数据','error');showMessage(browserLoadIssues.join('；')+'。原记录未覆盖，请先不要重新作答。')}
 else setBrowserSaveStatus(hasProgress()?'已读取早期版本记录':'当前打开位置没有找到已有练习记录','ready')
}
function progressSnapshot(){return {format:'gre-all-v1',date:new Date().toISOString(),sections:records,section1:JSON.stringify(first),causes}}
function sectionHasProgress(s,isFirst=false){return !!(s&&(s.submitted||s.firstGraded||s.firstScore!=null||s.favorites?.length||s.attempts?.length||(isFirst?s.sel?.some(g=>g.some(a=>a.length)):s.answers?.some(a=>a.length))))}
function hasProgress(value=progressSnapshot()){return sectionHasProgress(typeof value.section1==='string'?JSON.parse(value.section1):value.section1,true)||Object.values(value.sections||{}).some(s=>sectionHasProgress(s))||Object.keys(value.causes||{}).length>0}
function validateProgress(v){
 const validFavorite=a=>Array.isArray(a)&&a.every(i=>Number.isInteger(i)&&i>=0&&i<7);
 const validScore=s=>s==null||(Number.isInteger(s)&&s>=0&&s<=7);
 const validLetters=a=>Array.isArray(a)&&a.every(x=>typeof x==='string'&&/^[A-I]$/.test(x))&&new Set(a).size===a.length;
 const validateHistory=s=>{if(s.attempts===undefined)return;if(!Array.isArray(s.attempts))throw Error('练习历史格式无效');const ids=new Set();for(const a of s.attempts){if(!a||typeof a.id!=='string'||!/^[A-Za-z0-9-]{1,100}$/.test(a.id)||ids.has(a.id)||a.total!==7||!validScore(a.score)||a.score==null||!Array.isArray(a.answers)||a.answers.length!==7||!a.answers.every(v=>validLetters(v)&&v.length<=3)||!Array.isArray(a.correct)||a.correct.length!==7||!a.correct.every(v=>typeof v==='boolean')||a.correct.filter(Boolean).length!==a.score||!Array.isArray(a.referenceAnswers)||a.referenceAnswers.length!==7||!a.referenceAnswers.every(v=>validLetters(v)&&v.length>=1&&v.length<=3)||(a.submittedAt!==null&&(typeof a.submittedAt!=='string'||!Number.isFinite(Date.parse(a.submittedAt)))))throw Error('练习历史条目无效');ids.add(a.id)}};
 const validateFirst=f=>{if(!f||typeof f!=='object'||Array.isArray(f))throw Error('Section 1 记录格式无效');if(f.sel&&(!Array.isArray(f.sel)||f.sel.length!==7||!f.sel.every((g,i)=>Array.isArray(g)&&g.length===questions(1)[i].g.length&&g.every((a,j)=>validLetters(a)&&a.length<=questions(1)[i].a[j].length))))throw Error('Section 1 作答格式无效');if(f.favorites&&!validFavorite(f.favorites))throw Error('收藏题号无效');if(!validScore(f.firstScore))throw Error('成绩格式无效');validateHistory(f);return f};
 if(v?.version===1&&v.state)return {scope:'section1',section1:validateFirst(v.state),sections:{},causes:{}};
 if(v?.format!=='gre-all-v1'||!v.sections||typeof v.sections!=='object'||Array.isArray(v.sections))throw Error('备份格式无效，请选择练习记录 JSON 或带记录的网页');
 for(const [n,s] of Object.entries(v.sections)){if(!Number.isInteger(+n)||+n<2||+n>200||!s||!Array.isArray(s.answers)||s.answers.length!==7||!s.answers.every(a=>validLetters(a)&&a.length<=3)||!validFavorite(s.favorites)||typeof s.submitted!=='boolean'||!validScore(s.firstScore))throw Error('Section '+n+' 的记录格式无效');validateHistory(s)}
 const f=validateFirst(v.section1?(typeof v.section1==='string'?JSON.parse(v.section1):v.section1):{}),c=v.causes||{};
 if(typeof c!=='object'||Array.isArray(c)||!Object.entries(c).every(([k,a])=>/^([1-9]|[1-9]\d|1\d\d|200)-[0-6]$/.test(k)&&Array.isArray(a)&&a.every(t=>['单词不会','句法错误'].includes(t))))throw Error('错因标签格式无效');
 return {scope:'all',sections:v.sections,section1:f,causes:c}
}
function mergeAttempts(old=[],incoming=[]){const map=new Map(old.map(a=>[a.id,a]));for(const a of incoming)if(!map.has(a.id))map.set(a.id,a);return [...map.values()]}
function mergeSection(previous,incoming){if(!previous)return incoming;const chosen=sectionHasProgress(incoming)?incoming:previous;return {...chosen,attempts:mergeAttempts(previous.attempts,incoming.attempts),favorites:[...new Set([...(previous.favorites||[]),...(incoming.favorites||[])])]}}
function mergeProgress(value){
 const combinedFirst=mergeAttempts(first.attempts,value.section1.attempts);if(sectionHasProgress(value.section1,true))first={...value.section1,attempts:combinedFirst,favorites:[...new Set([...(first.favorites||[]),...(value.section1.favorites||[])])]};else first.attempts=combinedFirst;
 if(value.scope!=='section1'){
  for(const [n,s] of Object.entries(value.sections))if(sectionHasProgress(s)||!records[n])records[n]=mergeSection(records[n],s);
  for(const [id,tags] of Object.entries(value.causes))causes[id]=[...new Set([...(causes[id]||[]),...tags])];
 }
 for(let n=1;n<=answerBank.sections.length;n++)if(state(n).submitted)archiveAttempt(n,true);
 save();render()
}
async function restoreProgress(value){
 if(!await confirmInline('将合并导入作答、收藏和错因标签。同一个 Section 有两份作答时，以导入的有效记录为准；没有作答的空记录不会覆盖当前进度。继续吗？'))return;
 previousImport=JSON.parse(JSON.stringify(progressSnapshot()));try{localStorage.setItem(progressKey('gre-before-restore-v1'),JSON.stringify(previousImport))}catch{}
 mergeProgress(value);$('#status').textContent=storageAvailable?'记录已合并恢复；如需撤销，请打开“找回旧版记录”':'记录已载入当前页面，但浏览器未能保存，请立即下载备份'
}
function attachedProgress(){const node=document.getElementById('gre-carried-progress');if(!node)return null;try{return validateProgress(JSON.parse(node.textContent))}catch{return null}}
function legacyProgress(){if(!window.GRE_STORAGE_PREFIX)return null;try{const v={format:'gre-all-v1',sections:JSON.parse(localStorage.getItem('gre-sections-2-35-v1')||'{}'),section1:localStorage.getItem('gre-sec1-v1')||'{}',causes:JSON.parse(localStorage.getItem('gre-error-causes-v1')||'{}')};return hasProgress(v)?validateProgress(v):null}catch{return null}}
function progressHelp(){return `<div class="heading"><div><div class="eyebrow">YOUR PRACTICE RECORDS</div><h1>找回我的练习记录</h1><p>记录保存在浏览器中。新下载文件的名称、位置或打开方式变化时，可能无法读取旧网页的记录。</p></div><button data-home>返回练习</button></div><section class="card"><h2>旧版还能看到记录</h2><ol class="recovery-steps"><li>使用原来的浏览器，打开上一个版本的 HTML 文件。</li><li>在旧版页面底部点击「下载练习记录」。</li><li>回到这里，导入刚下载的 JSON 文件，恢复作答、收藏和错因。</li></ol><button class="primary" data-import-progress>导入旧版练习记录</button><p class="muted">也兼容最早版本的 Section 1 单组备份。导入空白单元不会覆盖已有进度。</p></section><section class="card"><h2>其他恢复入口</h2><div class="tools"><button data-restore-attached ${attachedProgress()?'':'disabled'}>恢复本网页附带的记录</button><button data-restore-legacy ${legacyProgress()?'':'disabled'}>读取当前浏览器的早期版本记录</button><button data-undo-import>撤销上次记录导入</button></div><p class="muted">这些入口只读取当前网页有权访问的数据，无法跨文件直接读取另一个旧网页的浏览器存储。不要清除浏览器数据；如果旧版和备份都没有可读记录，目前无法保证恢复。</p></section>${window.GRE_PREVIEW?'<section class="card"><h2>以后更新时，把记录一起带走</h2><p>离开或更新前，点击「保存带记录的网页」。下载的新 HTML 会附带当前练习记录，在新文件中打开时可自动恢复。</p><button data-portable-progress>保存带记录的网页</button><p class="muted">也可继续使用 JSON 记录备份。更换浏览器或设备时，同样可以导入。</p></section>':''}`}
function downloadBlob(content,type,name){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportPortablePage(){
 const copy=document.documentElement.cloneNode(true);copy.querySelector('#gre-carried-progress')?.remove();copy.querySelector('#storageNotice')?.remove();copy.querySelector('#app').innerHTML='';
 const payload=document.createElement('script');payload.type='application/json';payload.id='gre-carried-progress';payload.textContent=JSON.stringify(progressSnapshot()).replace(/</g,'\\u003c');copy.querySelector('head').append(payload);
 downloadBlob('<!doctype html>\n'+copy.outerHTML,'text/html;charset=utf-8','GRE-Section-1-5-我的记录.html');$('#status').textContent='已下载带记录的网页；请保留该文件，更新前也可另存 JSON 备份'
}
function showStorageNotice(){if(storageAvailable||$('#storageNotice'))return;const notice=document.createElement('div');notice.id='storageNotice';notice.className='storage-notice';notice.setAttribute('role','alert');notice.innerHTML='当前浏览器无法自动保存练习记录。离开前请下载记录备份'+(window.GRE_PREVIEW?'或保存带记录的网页':'')+'。';document.querySelector('header').after(notice)}
function bindProgressTools(){
 document.querySelectorAll('[data-import-progress]').forEach(b=>b.onclick=()=>$('#import').click());
 document.querySelectorAll('[data-portable-progress]').forEach(b=>{b.hidden=!!window.GRE_BACKEND;b.onclick=exportPortablePage});
 document.querySelectorAll('[data-restore-attached]').forEach(b=>b.onclick=()=>{const v=attachedProgress();if(v)restoreProgress(v)});
 document.querySelectorAll('[data-restore-legacy]').forEach(b=>b.onclick=()=>{const v=legacyProgress();if(v)restoreProgress(v)});
 document.querySelectorAll('[data-undo-import]').forEach(b=>b.onclick=async()=>{const raw=previousImport||read('gre-before-restore-v1',null);if(!raw){showMessage('当前网页没有可撤销的导入记录');return}const v=validateProgress(raw);if(!await confirmInline('恢复到上次导入前的记录？导入之后的新作答将被替换。'))return;first=v.section1;records=v.sections;causes=v.causes;save();render()})
}
$('#favorites').onclick=()=>go('favorites');$('#home').onclick=()=>go('');if($('#history'))$('#history').onclick=()=>go('history');$('#export').onclick=()=>downloadBlob(JSON.stringify(progressSnapshot(),null,2),'application/json','gre-practice-backup.json');
$('#import').onchange=async e=>{try{if(!e.target.files[0])return;const text=await e.target.files[0].text();let data;if(text.trim().startsWith('<')){const node=new DOMParser().parseFromString(text,'text/html').getElementById('gre-carried-progress');if(!node)throw Error('这份旧网页本身没有附带记录。请用原浏览器打开旧网页，点击“下载练习记录”，再导入 JSON 文件。');data=JSON.parse(node.textContent)}else data=JSON.parse(text);await restoreProgress(validateProgress(data))}catch(error){showMessage(error.message||'无法读取备份，现有记录未修改')}finally{e.target.value=''}};
window.addEventListener('hashchange',()=>{if(!window.GRE_READY)return;render();window.scrollTo(0,0)});
window.addEventListener('beforeunload',event=>{if(window.GRE_BROWSER_STORE&&browserPending&&browserSyncSaved<browserRevision){event.preventDefault();event.returnValue=''}});
async function startApplication(){
 const loading=window.GRE_BROWSER_STORE&&!window.GRE_BACKEND;
 if(loading){$('#app').innerHTML='<p class="muted" style="padding:32px 0">正在读取本浏览器的练习记录…</p>';document.querySelectorAll('header button,.toolbar button,.toolbar input').forEach(el=>el.disabled=true);await loadBrowserProgress()}
 else try{const probe=progressKey('gre-storage-probe-'+Date.now()+'-'+Math.random());localStorage.setItem(probe,'1');localStorage.removeItem(probe)}catch{storageAvailable=false}
 const carried=attachedProgress();if(carried&&!hasProgress())mergeProgress(carried);
 let migratedAttempts=false;for(let n=1;n<=answerBank.sections.length;n++)if(state(n).submitted&&archiveAttempt(n,true))migratedAttempts=true;
 document.querySelectorAll('header button,.toolbar button,.toolbar input').forEach(el=>el.disabled=false);window.GRE_READY=true;render();initializeRecordFileTools();
 if(loading){if(migratedAttempts&&hasProgress())saveBrowserProgress();if(navigator.storage?.persist)navigator.storage.persist().catch(()=>{})}
 else{if(migratedAttempts)save();showStorageNotice();if(window.GRE_BACKEND&&migratedAttempts)queueRecordFileSave()}
}
startApplication();
