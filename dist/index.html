window.GRE_BANK.section56=[{"number": 1, "t": "In an ironic twist, the recent ______ of the reductive observational methods that have enabled science to progress for four centuries may turn out to be science's biggest step forward.", "o": ["A. introduction", "B. validation", "C. acceptance", "D. standardization", "E. questioning"], "translation": "一个讽刺性的转折是，近来对过去四百年推动科学进步的还原式观察方法的质疑，可能反而成为科学最大的进展。", "grammar": "主语 questioning ...；that have enabled ... 修饰 methods；may turn out to be 为可能结果；In an ironic twist 给反转线索。", "reason": "E questioning。质疑曾助进步的方法，又成为进步，才有讽刺反转；validation、acceptance 只是延续旧认可。", "sourcePages": [125, 126]}, {"number": 2, "t": "To abolish the existence of nation-states is neither feasible nor desirable; but insofar as there are collective interests that transcend national boundaries, the (i) ______ of nation-states must be (ii) ______ to international institutions.", "o": ["A. sovereignty", "B. traditions", "C. genealogy", "D. subordinated", "E. attributable", "F. analogous"], "translation": "废除民族国家既不可行也不可取；但对于超越国界的共同利益，国家主权须从属于国际机构。", "grammar": "To abolish ... 是首句主语；neither ... nor ... 双否定；insofar as 限定后结论适用范围；subordinated to 为被动。", "reason": "A sovereignty、D subordinated。不是消灭国家，而在跨国利益上让渡部分权力；traditions、genealogy 并非管辖权限。", "sourcePages": [125, 126]}, {"number": 3, "t": "Reviews written by music critic and composer Stephenson were hardly (i) ______: musicians who performed his music could count on sympathetic coverage, while those who ignored him were held to (ii) ______ standards.", "o": ["A. disinterested", "B. lucid", "C. conventional", "D. exacting", "E. minimal", "F. accepted"], "translation": "音乐评论家兼作曲家斯蒂芬森的评论很难说公正：演奏其作品的人能得到同情性报道，忽略他的人则被用苛刻标准审视。", "grammar": "written by ... 修饰 reviews；hardly 否定公正；while 对比两类待遇；held to ... standards 为按某标准要求。", "reason": "A disinterested、D exacting。disinterested 是无私公正，并非无兴趣；偏袒自己合作者、苛待他人体现利益偏见。", "sourcePages": [125, 126]}, {"number": 4, "t": "People love to talk about their commutes to and from work: those with an easy commute tend to (i) ______, while those who hate their commute think and speak of it as a core affliction, like a chronic illness. Once you raise the subject, the testimonies pour out, and, if your ears are tuned to it, you begin overhearing commute talk everywhere. People who are normally (ii) ______ may, when describing their commutes, be unexpectedly (iii) ______ divulging the intimate details of their lives.", "o": ["A. grumble", "B. commiserate", "C. gloat", "D. inattentive", "E. garrulous", "F. circumspect", "G. candid in", "H. economical in", "I. flustered about"], "translation": "人们爱聊通勤：轻松者往往得意，痛苦者把它视作慢性病般的折磨。话题一开，倾诉涌来；平时谨慎的人谈起通勤，也可能意外坦率，透露生活隐私。", "grammar": "those with ... 与 those who ... 对照；Once 为触发情境；People who ... 为末句主语；when describing 插入，candid in divulging 为坦于披露。", "reason": "C gloat、F circumspect、G candid in。轻松者自得，对比痛苦者；平时谨慎与突然泄露隐私反向，非 garrulous（话多）。", "sourcePages": [125, 126]}, {"number": 5, "t": "There is a revelation on almost every page of this book, and the author's prose is ______ in the best possible way: blunt, sweet, off-kilter, and often quite funny.", "o": ["A. eloquent", "B. austere", "C. somber", "D. awkward", "E. solemn", "F. ungainly"], "translation": "这本书几乎每页都有新发现，作者文笔以最好的方式显得笨拙不修饰：直率、甜美、不按常规，而且常常幽默。", "grammar": "prose is ... 为主干；in the best possible way 限定贬词的褒义使用；冒号后具体解释 off-kilter 风格。", "reason": "D awkward、F ungainly，均为不圆熟、拙朴。作者刻意正面使用看似负面的词；somber、solemn 是严肃，与 funny 不合。", "sourcePages": [125, 126]}, {"number": 6, "t": "A few decades ago the idea of animal morality would have been met with ______; however, recent research suggests that animals not only act altruistically but also have the capacity for empathy, forgiveness, trust, and reciprocity.", "o": ["A. derision", "B. resentment", "C. dismissal", "D. conviction", "E. ridicule", "F. certainty"], "translation": "几十年前，动物也有道德的想法可能遭嘲笑；近来研究却指出，动物不只利他，还能共情、宽恕、信任与互惠。", "grammar": "would have been met with 为过去假设反应；however 转向新证据；not only ... but also ... 表能力递进。", "reason": "A derision、E ridicule，均为嘲讽。旧怀疑与新发现相反；conviction、certainty 是确信，方向不合。", "sourcePages": [125, 126]}, {"number": 7, "t": "The town's air was consistently ______: depending on the breeze, one might be greeted with the sour effluvia of twenty breweries, choking fumes from the coal factory, or brackish smells from the nearby river.", "o": ["A. malodorous", "B. toxic", "C. redolent", "D. benign", "E. noisome", "F. anodyne"], "translation": "镇上的空气总是恶臭：风向不同，可能闻到二十家酿酒厂的酸腐气、煤厂呛烟，或附近河流的咸腐气味。", "grammar": "consistently 为总体性质；depending on the breeze 为条件；be greeted with 是被迎面袭来的气味；三种来源并列。", "reason": "A malodorous、E noisome，均为臭的。sour、choking、brackish 都描写难闻；toxic 强调有毒，无法仅由气味推出。", "sourcePages": [125, 126]}];

window.GRE_BANK.section57=[{"number": 1, "t": "Baker set a new standard for explaining difficult art in language the public could understand, consequently, her books remain exemplars of ______ in art-historical analysis.", "o": ["A. fashion", "B. rigor", "C. lucidity", "D. erudition", "E. grandiosity"], "translation": "贝克用公众可理解的语言解释艰深艺术，树立了新标准；她的书因此仍是艺术史分析清晰易懂的典范。", "grammar": "for explaining ... 限定标准领域；language 后省略关系词；consequently 引结果，exemplars of ... 表某品质典范。", "reason": "C lucidity（清晰）。understand 直接提示；erudition 是博学，未突出传达方式。", "sourcePages": [127, 128]}, {"number": 2, "t": "If the candidate wins the election now that rivals within his own party have (i) ______ him in a campaign that was (ii) ______ without their help, he will be mightily indebted to these self-styled saviors.", "o": ["A. rallied to", "B. separated from", "C. undermined", "D. foundering", "E. effective", "F. improving"], "translation": "如果这位候选人在党内对手转而支持后赢得选举，就会深深欠下这些自称救世主者的人情，因为没有帮助时竞选原已陷入困境。", "grammar": "If 为条件；now that 给支持已来的背景；that was foundering 修饰 campaign；without their help 为反事实或先前条件。", "reason": "A rallied to、D foundering。赢后 indebted 说明对手帮助救场，非 undermined；effective 无法体现 saviors 的挽救作用。", "sourcePages": [127, 128]}, {"number": 3, "t": "Communal feeding is a remarkable behavioral aspect of this generally solitary animal. It is also misunderstood behavior and one of the reasons that Tasmanian devils have a bad reputation. Far from being a (i) ______, communal devil feeding is (ii) ______ and purposeful, and is described as (iii) ______ behavior. The screaming and apparent fighting is an elaborate combination and variety of vocalizations and postures by which order is maintained.", "o": ["A. free-for-all", "B. rarity", "C. necessity", "D. structured", "E. vicious", "F. infrequent", "G. innate", "H. acquired", "I. ritualized"], "translation": "通常独居的袋獾会集体进食，这一特别而易遭误解的行为使它们名声不佳。但进食并非混战，而是有结构、有目的的仪式化行为；尖叫和看似争斗的动作是维持秩序的复杂声音姿态组合。", "grammar": "Far from being ... 否定表象；structured 与 purposeful 并列；by which 引关系从句，指通过声音姿态维持秩序。", "reason": "A free-for-all、D structured、I ritualized。apparent fighting 不代表无序，elaborate combination 与 order 提示程式化；vicious 会延续错误坏名声。", "sourcePages": [127, 128]}, {"number": 4, "t": "For those of us who have been intoxicated by the power and potential of mathematics, the mystery isn't why that fascination developed but why it isn't ______.", "o": ["A. advantageous", "B. discounted", "C. prevalent", "D. undervalued", "E. celebrated", "F. widespread"], "translation": "对陶醉数学力量和潜能的人而言，难解的不是迷恋如何产生，而是它为何没有更广泛地存在。", "grammar": "not why ... but why ... 对比两个疑问；it 指 fascination；For those ... 限定判断视角。", "reason": "C prevalent、F widespread，均为普遍。魅力令人深信，所以困惑其未普及，而非为何有用或受颂扬。", "sourcePages": [127, 128]}, {"number": 5, "t": "In ways large and small, millions of people are taking active steps to ______ the medical mainstream, whether by taking herbal remedies for disease or by placing their hopes for a cure in alternative treatment.", "o": ["A. augment", "B. sidestep", "C. support", "D. vilify", "E. circumvent", "F. endorse"], "translation": "数百万人在各种层面主动绕开主流医疗，使用草药，或把治愈希望寄托于替代疗法。", "grammar": "taking steps to ... 为采取行动；whether by ... or by ... 并列方式；alternative 与 mainstream 构成对照。", "reason": "B sidestep、E circumvent，均为绕开。不是支持或赞同主流，也未说谴责主流；vilify 过强。", "sourcePages": [127, 128]}, {"number": 6, "t": "Her attempts to wrest fiction free from traditional constraints like plot and character were never entirely popular with readers; nonetheless, her fiction has had ______ influence on critical theory, novel, cinema, and even psychology.", "o": ["A. a studied", "B. a negligible", "C. a decisive", "D. an unmistakable", "E. an insignificant", "F. a restorative"], "translation": "她解放小说、摆脱情节人物等传统限制的尝试，未完全赢得读者喜爱；然而作品对批评理论、小说、电影甚至心理学有显著确切影响。", "grammar": "attempts to wrest ... free 为主语；nonetheless 连接反差；influence on 后列影响领域。", "reason": "C a decisive、D an unmistakable，均强调明确重要。读者接受不足却影响可观；negligible、insignificant 反向。", "sourcePages": [127, 128]}, {"number": 7, "t": "Although the biography never explicitly assesses what role the dynamic between Mr. Merrill's parents might have played in the development of his personality, the author offers plenty of ______.", "o": ["A. mystification", "B. elucidation", "C. speculation", "D. reflection", "E. obfuscation", "F. conjecture"], "translation": "传记虽从未明确评估梅里尔父母间的互动对其人格成长有何作用，作者却提供了许多推测。", "grammar": "Although 引让步；what role ... might have played 为宾语从句；主句 author offers ...；his 指 Merrill。", "reason": "C speculation、F conjecture，均为推测。未作明确判断却有猜想，正与 explicitly assesses 对照；elucidation 为阐明，力度过实。", "sourcePages": [127, 128]}];

window.GRE_BANK.section58=[{"number": 1, "t": "A curiosity of the film Vertigo is its capacity to generate emotional power from a plot that lacks the most of elementary ______: viewers are required to accept not an isolated implausibility, but a continuous stream of them.", "o": ["A. believability", "B. impact", "C. narrative", "D. tension", "E. premise"], "translation": "《迷魂记》的奇特之处，是能从连最基本可信性都缺乏的情节中产生情感力量；观众须接受的并非偶尔一处不可信，而是一连串。", "grammar": "curiosity ... is its capacity ...；that lacks ... 修饰 plot；not an isolated ... but a continuous stream 对比程度。【原书核对】原书第128页确为 the most of elementary，of 显得多余，仍按原书保留。", "reason": "A believability（可信度）。implausibility 是直接反义提示；narrative 为叙事，不能由一串不合理推出完全无叙事。", "sourcePages": [129, 130]}, {"number": 2, "t": "Interest in creating handheld computers is fueled by the desire to shrink the size of the electronic circuitry and to create exceptionally small mechanical systems. At this scale, however, physical (i) ______ poses unique challenges. Machining, positioning, and assembling parts by hand are easy at macroscopic scales but at minute scales they are far from (ii) ______.", "o": ["A. deterioration", "B. manipulation", "C. durability", "D. subtle", "E. inflexible", "F. routine"], "translation": "制造掌上电脑的兴趣源于缩小电路和机械系统的愿望。但在微小尺度上，物理操作有独特挑战；宏观下手工加工、定位、组装容易，微观下却绝非寻常简单。", "grammar": "is fueled by ... 为被动原因；At this scale 回指极小尺度；三个动名词并列作主语；far from routine 为否定常规易行。", "reason": "B manipulation、F routine。machining、positioning、assembling 都是操作；deterioration 是损坏，非段落讨论的技术行动。", "sourcePages": [129, 130]}, {"number": 3, "t": "The introductions to each section, written by the editors of the anthology, provide useful background material, but they do not provide critical analysis of the articles. Because the articles are in many senses the editors' personal favorites, it is probably (i) ______ to expect more from the introductions—but if the book is to be read by advanced students, such criticism would be as (ii) ______ as the articles themselves.", "o": ["A. juvenile", "B. paradoxical", "C. unrealistic", "D. biased", "E. complex", "F. informative"], "translation": "选集编者写的各节导言提供有用背景，却不批评分析文章。既然文章多是编者偏爱，期待导言更多批评或不现实；但对高阶学生而言，批评本能像原文一样有启发。", "grammar": "written by ... 修饰 introductions；Because 引原因；it is unrealistic to ... 中 it 为形式主语；as informative as 为同等比较。", "reason": "C unrealistic、F informative。偏爱使客观批评难期待，高阶教学却需要批评提供信息；biased 是有偏见，不是有用教育价值。", "sourcePages": [129, 130]}, {"number": 4, "t": "A bird's feathers would seem to be a (i) ______ design for protecting a bird from attack by microscopic organisms. They create a warm, moist space next to the skin that could be an ideal incubator for spores. Wild birds rarely (ii) ______ skin diseases, however. The chemicals in the sebum include an array of antibacterial and anti-fungal agents that allow the bird's skin to (iii) ______.", "o": ["A. perfect", "B. typical", "C. poor", "D. contract", "E. overcome", "F. notice", "G. stay healthy", "H. become irritated", "I. recover quickly"], "translation": "羽毛看似不利于抵御微生物，因为它在皮肤旁制造温暖潮湿、适合孢子繁殖的空间；但野鸟很少感染皮肤病，因皮脂含多种抗菌抗真菌物质，使皮肤保持健康。", "grammar": "would seem 为初步推断；that could be ... 修饰 space；however 反转；allow skin to ... 为使役。", "reason": "C poor、D contract、G stay healthy。暖湿看似差设计，实际少患病，化学防御解释健康；recover quickly 会暗示常先感染，未获支持。", "sourcePages": [129, 130]}, {"number": 5, "t": "Although most scientists hold that quantum theory and the theory of general relativity ought to be intimately connected, the theories have remained stubbornly ______.", "o": ["A. consistent", "B. unlinked", "C. self-contradictory", "D. estranged", "E. arbitrary", "F. congruent"], "translation": "多数科学家虽认为量子理论和广义相对论应密切相连，两者却顽固地保持疏离、未能联结。", "grammar": "Although 为让步；hold that ... 为认为；主句 theories have remained ...；intimately connected 是预期状态。", "reason": "B unlinked、D estranged，均为分离。与 connected 对立；self-contradictory 是理论内部矛盾，不等于两理论未统一。", "sourcePages": [129, 130]}, {"number": 6, "t": "She expected her book to be ______, but in fact few of her readers disagreed with its premise that street art, long considered a mere sideshow entertainment, deserved to be regarded as high art.", "o": ["A. controversial", "B. dramatic", "C. impressive", "D. acclaimed", "E. provocative", "F. popular"], "translation": "她原以为书会引起争议，但很少读者反对其主张：长期被当作边缘娱乐的街头艺术，应被视为高雅艺术。", "grammar": "expected book to be ...；but in fact 转折；premise 后 that 从句说明主张；long considered ... 修饰 street art。", "reason": "A controversial、E provocative，均为易引发争论。few disagreed 否定预期争议；acclaimed、popular 表受欢迎，不能与实情反差。", "sourcePages": [129, 130]}, {"number": 7, "t": "Despite its best efforts to stimulate sales, the bookselling business remains far from ______, for it has high fixed costs in wages and rent, and falling prices make these ever harder to spur.", "o": ["A. effective", "B. healthy", "C. innovative", "D. robust", "E. stingy", "F. parsimonious"], "translation": "售书业虽尽力刺激销售，仍远谈不上健康强健：工资租金固定成本高，价格下降使负担更难承受。", "grammar": "Despite 为让步；remains far from ...；for 引原因；these 指高固定成本。原书末词 spur 不自然，按上下文理解成本负担，不默改题面。【原书核对】原书第129页末词确为 spur，此处与 costs 的搭配不通；题面保留，译文中“负担更难承受”是上下文解释，不是 spur 的正常词义。", "reason": "B healthy、D robust，均为经营强健。高成本与售价跌说明困难；parsimonious、stingy 是吝啬，不是商业健康状态。", "sourcePages": [129, 130]}];

window.GRE_BANK.section59=[{"number": 1, "t": "Many Latin American writers and critics have come to bristle at the very mention of the type of fiction termed “magic realism,” but to the common reader the appeal of such fiction is ______.", "o": ["A. elusive", "B. undiminished", "C. unfathomable", "D. unexpected", "E. derivative"], "translation": "许多拉美作家评论家如今听到“魔幻现实主义”就反感，但普通读者对这类小说的兴趣丝毫未减。", "grammar": "have come to bristle at 表逐渐产生反感；but 对比专业者与大众；appeal ... is ... 为后半主干。", "reason": "B undiminished（未减弱的）。专家反感、大众仍喜欢；elusive、unfathomable 是难理解，未体现受欢迎程度。", "sourcePages": [131, 132]}, {"number": 2, "t": "The virtual absence of cougars from late prehistoric faunas in the North American Great Basin (i) ______ a general scarcity of carnivores from these sites: bobcats, coyotes, and badgers are routinely found, and even such historically (ii) ______ carnivores as bears and wolves are found as well.", "o": ["A. largely parallels", "B. does not reflect", "C. is a consequence of", "D. widespread", "E. rare", "F. representative"], "translation": "北美大盆地晚史前动物群几乎没有美洲狮，并不表示当地肉食动物普遍稀少；山猫、郊狼、獾常见，甚至熊狼等历史上少见的食肉动物也能找到。", "grammar": "absence ... 为主语；冒号后列反例；even such ... as ... 为连罕见类也有的递进；sites 指遗址。", "reason": "B does not reflect、E rare。其他肉食动物常见排除普遍稀少；even 要求意外，故连 rare 类也被发现。", "sourcePages": [131, 132]}, {"number": 3, "t": "For a time in the early Middle Ages, Latin culture came close to (i) ______: the witness to that is the (ii) ______ of manuscript copies of texts datable to the period. The process of copying manuscripts, the only way in which the fragile products of centuries of accumulating knowledge could be preserved, (iii) ______, a situation that did not change for two and a half centuries, until the time of Charlemagne. In the intervening period, much of Classical literature was lost to use forever.", "o": ["A. reversing", "B. exploding", "C. vanishing", "D. paucity", "E. provenance", "F. proliferation", "G. was pursued methodically", "H. expressed the spirit of the time", "I. virtually came to a standstill"], "translation": "中世纪早期，拉丁文化一度濒临消失，证据是可断代于当时的抄本很少。抄写本是保存数世纪知识积累的唯一方式，却几乎停顿，直到二百五十年后的查理曼时期；期间许多古典文献永久失传。", "grammar": "witness to that 表证据；the only way ... 为抄写过程的同位解释；in which 引保存途径；until 限停顿终点。【原书核对】原书第130页确为 lost to use forever，疑为原书词形瑕疵；译文按文献永久失传理解，题干不改为 us。", "reason": "C vanishing、D paucity、I virtually came to a standstill。复制停滞导致抄本少、文化流失；proliferation 是增多，方向相反。", "sourcePages": [131, 132]}, {"number": 4, "t": "Today the chair of task force in charge of revising the psychiatric diagnostic manual is ______ post—people work for years to position themselves as candidates—but in the early 1970s, descriptive psychiatry was a backwater.", "o": ["A. a coveted", "B. an arduous", "C. a taxing", "D. a lucrative", "E. an enviable", "F. an influential"], "translation": "如今主持精神病诊断手册修订的工作组是人人向往的职位，人们多年筹备竞争；但七十年代初，描述精神病学仍是冷僻领域。", "grammar": "破折号内争取职位解释受欢迎；but 对比今昔；chair 为职位而非椅子；in charge of 修饰 task force。", "reason": "A a coveted、E an enviable，均为令人羡慕。竞逐多年说明职位有吸引力；arduous、taxing 强调费力，不能直接由竞争推出。", "sourcePages": [131, 132]}, {"number": 5, "t": "The astronomer admits that his interpretation of so-called Population III stars is ______ at present since no one has yet done any real calculations to see if it holds up under closer scrutiny.", "o": ["A. spurious", "B. speculative", "C. predictive", "D. conjectural", "E. fabricated", "F. implausible"], "translation": "天文学家承认，他目前对所谓第三星族恒星的解释仍属推测，因为还没人真正计算检验它能否经受仔细审查。", "grammar": "admits that ...；since 给未证实原因；to see if ... 为计算目的；it 指该解释而非恒星。", "reason": "B speculative、D conjectural，均为推测性的。尚无计算不等于虚假 fabricated、spurious，只说明未经验证。", "sourcePages": [131, 132]}, {"number": 6, "t": "British critics covering African American musicians performing in London in the 1910s had little idea how to distinguish what was authentic African American music from what was ______, but they knew such a distinction existed.", "o": ["A. eclectic", "B. genuine", "C. derivative", "D. spurious", "E. legitimate", "F. specious"], "translation": "二十世纪一十年代报道非裔音乐家伦敦演出的英国评论者，几乎不知如何区分真正的非裔美国音乐与貌似真实的伪品，但知道这种区别存在。", "grammar": "covering ... 修饰 critics；how to distinguish A from B 为宾语；what was ... 为名词性从句；but 表能力不足却知道有别。", "reason": "D spurious、F specious，均可指伪真、似是而非。与 authentic 对立；derivative 是衍生模仿，未必是假冒。", "sourcePages": [131, 132]}, {"number": 7, "t": "For parents, the pleasure of letting children choose which book to read aloud together is not always ______: I well remembered my inner groans when my child would constantly pick my least favorite book from the shelf.", "o": ["A. intangible", "B. enduring", "C. impalpable", "D. unalloyed", "E. ephemeral", "F. unqualified"], "translation": "对父母而言，让孩子挑选共同朗读的书，并不总带来纯粹的愉悦；我记得孩子总挑我最不喜欢的书时，自己内心的呻吟。", "grammar": "not always 为部分否定；of letting children choose ... 修饰 pleasure；when 为回忆情境；my least favorite 与乐趣对照。", "reason": "D unalloyed、F unqualified，均为不掺杂、不打折的。乐趣混入烦恼；ephemeral、enduring 为时长，不是纯度。", "sourcePages": [131, 132]}];

window.GRE_BANK.section60=[{"number": 1, "t": "Given the many thematic strands that the book seeks to draw together into a continuous cord of narrative, it is perforce work of ______, which is not to say that the author's research fails to provide sufficient detail about each of his chosen themes.", "o": ["A. synthesis", "B. conjecture", "C. analysis", "D. reconstruction", "E. accretion"], "translation": "这本书力求把许多主题线索编成连续叙事，因而必然是综合之作；这并不表示作者未对每个所选主题提供足够研究细节。", "grammar": "Given 引原因；that 修饰 strands；which is not to say ... 否定可能误解；fails to provide 的否定范围需读为“并非未提供”。【原书核对】原书第132页确为 perforce work of，未印通常所需的冠词，照录。", "reason": "A synthesis（综合）。draw together into ... 是直接线索；analysis 偏分解，不能准确对应多主题整合。", "sourcePages": [133, 134]}, {"number": 2, "t": "Throughout much of the twentieth century, common scientific sense seemed to dictate that animals could not make a choice based on radical or aesthetic criteria. Such choices were (i) ______ the mental capacity of humans. Scientists who (ii) ______ this animal-human cognitive division were often accused of anthropomorphism.", "o": ["A. reserved for", "B. inconsistent with", "C. similar to", "D. accepted", "E. transgressed", "F. exacerbated"], "translation": "二十世纪大部分时间，科学常识似乎认为动物无法按激进或审美标准选择，这类能力被保留给人类；越过这种人兽认知界线的科学家常被指拟人化。", "grammar": "dictate that ... 表被认为必然；Such choices 回指前句；who transgressed ... 修饰 scientists。原书确印 radical，不能默改 rational。【原书核对】已核对原书第132页：确为 radical，不是 rational；原题保留。译文直译“激进”，解题只依据人兽能力界线与拟人化指控。", "reason": "A reserved for、E transgressed。把能力专属人类，越界赋予动物便被指拟人化；accepted 界线不会引起这种指责。", "sourcePages": [133, 134]}, {"number": 3, "t": "Common sense tells us some people are more (i) ______ than others. The claim that these differences are (ii) ______, or that deep down, everybody acts only to further their own interests, (iii) ______ observations and deep-seated human practices of moral evaluation.", "o": ["A. altruistic", "B. adaptable", "C. disciplined", "D. growing", "E. illusory", "F. relevant", "G. mimics", "H. explains", "I. contradicts"], "translation": "常识认为，有些人比另一些人更利他。声称差异只是幻觉、人人归根结底只谋私利，会违背观察及根深蒂固的人类道德评价实践。", "grammar": "claim 为后句主语；两个 that 从句解释主张，or 为换言之；contradicts 的宾语是 observations and practices，非 people。", "reason": "A altruistic、E illusory、I contradicts。把所有行为说成自利，就是否认利他差异，与首句常识和道德评价相冲突。", "sourcePages": [133, 134]}, {"number": 4, "t": "Many researchers assume that politicians consider the preferences of the entire public, and not merely those of likely voters, when making decisions. Yet, since the desire to be reelected is central, it is plausible that politicians (i) ______ the opinions of likely voters in formulating their positions on issues. It is possible that researchers' suppositions about policy makers' (ii) ______ aggregate public opinion may serve to (iii) ______ the fact that only the preferences of likely voters actually matter.", "o": ["A. rely insufficiently on", "B. depart sporadically from", "C. attend disproportionately to", "D. responsiveness to", "E. neglect of", "F. misrepresentation of", "G. mask", "H. reflect", "I. obviate"], "translation": "研究者常假定政治家决策时考虑全体公众，而非只考虑可能投票者。但连任动机使政治家很可能格外关注会投票的人；研究者假定其回应整体民意，反可能掩盖实际上只这些选民偏好重要。", "grammar": "those 代指 preferences；Yet 转折；since 引连任动机；suppositions 为末句主语，serve to mask 为谓语结构。", "reason": "C attend disproportionately to、D responsiveness to、G mask。全体假设遮蔽选民偏重，故不是 reflect（反映）；neglect of 整体民意反会揭露偏重。", "sourcePages": [133, 134]}, {"number": 5, "t": "Caricature can be revealing as well as amusing, and Ager's novel is both: Ager's delineation of class, ethnic, and generational struggle is exaggerated for comical effect, but it ______ nonetheless.", "o": ["A. resonates", "B. entertains", "C. diverts", "D. confuses", "E. rings true", "F. falls short"], "translation": "讽刺漫画既能逗乐也能揭示真相，阿格的小说两者兼具：阶级、族群与代际冲突描写虽为喜剧效果而夸张，却仍引起真实共鸣。", "grammar": "both 指 revealing 与 amusing；but 与 nonetheless 对比夸张和真实洞见；it 指描写，不是人物。", "reason": "A resonates、E rings true，均为真实可信、引起共鸣。amusing 已被 comical effect 覆盖，此空补 revealing；entertains、diverts 只重复逗乐。", "sourcePages": [133, 134]}, {"number": 6, "t": "Language, like speech, is primarily a human faculty, although both functions may also exist in a more ______ form in lesser primates.", "o": ["A. indispensable", "B. crucial", "C. primitive", "D. intelligible", "E. recognizable", "F. rudimentary"], "translation": "语言和言语主要是人类能力，但两种功能在较低等灵长类中，也可能以更原始、初步的形式存在。", "grammar": "like speech 为比较插入；although 为让步；in a ... form 描述其他灵长类的程度，both 指两种功能。", "reason": "C primitive、F rudimentary，均为初级未充分发展。primarily human 不排除其他物种初级形式；intelligible 是可理解，不指发展程度。", "sourcePages": [133, 134]}, {"number": 7, "t": "The story lines of silent dramas may often have been ______, yet within those basic narrative outlines, the true artists among silent-film actors could express emotional shadings that have no analogue in spoken language.", "o": ["A. implausible", "B. incredible", "C. conventional", "D. elemental", "E. rudimentary", "F. confusing"], "translation": "默片的故事常很简单，但真正出色的演员能在基本叙事框架中，表达口语所没有的细微情绪。", "grammar": "yet 为简单剧情与丰富表现的反差；within ... 限框架；that have no analogue 修饰 emotional shadings。", "reason": "D elemental、E rudimentary，均为基础简单。basic narrative outlines 直接同义提示；implausible、incredible 是不可信，不是简单。", "sourcePages": [133, 134]}];

function answers(n,i){const s=state(n);return n===1?(s.sel?.[i]||[]).flat():s.answers?.[i]||[]}
function correct(n,i){return answers(n,i).slice().sort().join('')===letters(n,i).sort().join('')}
function groups(n,i){const q=questions(n)[i];if(n===1)return q.g;const choices=reviewed(n)?q.o:null;const sets=kind(n,i)==='multi'?['ABC','DEF','GHI'].slice(0,letters(n,i).length):[kind(n,i)==='single'?'ABCDE':'ABCDEF'];return sets.map(set=>[...set].map(a=>choices?.find(o=>o[0]===a)||a))}
function needed(n,i){return kind(n,i)==='equivalent'?2:1}
function complete(n,i){return groups(n,i).every(g=>answers(n,i).filter(a=>g.some(o=>o[0]===a)).length===needed(n,i))}
function save(){
 if(window.GRE_BROWSER_STORE&&!window.GRE_BACKEND){saveBrowserProgress();return}
 try{localStorage.setItem(progressKey('gre-sec1-v1'),JSON.stringify(first));localStorage.setItem(progressKey('gre-sections-2-35-v1'),JSON.stringify(records));localStorage.setItem(progressKey('gre-error-causes-v1'),JSON.stringify(causes));localStorage.setItem(progressKey('gre-vocabulary-v1'),JSON.stringify(vocabulary));storageAvailable=true;$('#storageNotice')?.remove();$('#status').textContent='已自动保存至当前浏览器；更新前请另存记录'}catch{storageAvailable=false;$('#status').textContent='浏览器未能保存记录，请先下载记录备份或保存带记录的网页';if(!recordFileHandle)showStorageNotice()}
 if(recordFileHandle)queueRecordFileSave()
}
function go(route){location.hash=route;render();window.scrollTo(0,0)}
function tags(n,i){let id=`${n}-${i}`,v=causes[id]||[];return `<div class="tags"><span>错因归类</span>${['单词不会','句法错误'].map(t=>`<button data-cause="${id}" data-tag="${t}" aria-pressed="${v.includes(t)}">${t}</button>`).join('')}<small>${v.length?'可同时标记两种原因':'待归类 · 请根据复盘自行判断'}</small></div>`}
function explanation(n,i,collapsed=false,snapshot=null){
 const q=questions(n)?.[i];
 const content=`<p>你的答案：${(snapshot?.answers||answers(n,i)).slice().sort().join(' / ')||'未作答'}　正确答案：<b>${(snapshot?.reference||letters(n,i)).slice().sort().join(' / ')}</b></p><small>答案来源：${escapeHTML(answerBank.sections[n-1].sourceLabel||'配套答案表')}</small>${q?.sourcePages?`<p class="muted">原书核对：${q.sourcePages.map(p=>`<a href="pages/p-${String(p).padStart(3,'0')}.jpg" target="_blank" rel="noopener">第 ${p-1} 页</a>`).join(' · ')}</p>`:''}${q?.translation?`<h4>中文翻译</h4><p>${escapeHTML(q.translation)}</p><h4>长难句拆解</h4><p>${escapeHTML(q.grammar)}</p><h4>解题思路</h4><p>${escapeHTML(q.reason||q.e)}</p>`:'<p class="muted">本题中文翻译、长难句拆解和解题思路尚未补齐。</p>'}`;
 const causeTags=favorites(n).includes(i)?tags(n,i):'';
 return collapsed?`<details class="review-disclosure"><summary>答案与复盘</summary><div class="explanation">${content}</div></details>${causeTags}`:`<div class="explanation"><h3>答案与复盘</h3>${content}${causeTags}</div>`
}
function sourceImages(n,pages){return pages.map(p=>`<figure class="source-page"><img loading="lazy" width="1097" height="1550" src="pages/p-${String(p).padStart(3,'0')}.jpg" alt="Section ${n} 原书 PDF 第 ${p} 页"><figcaption>PDF 第 ${p} 页 · <a href="pages/p-${String(p).padStart(3,'0')}.jpg" target="_blank" rel="noopener">打开大图</a></figcaption></figure>`).join('')}
function question(n,i,review=false,attempt=null){let q=questions(n)?.[i],s=attempt?{submitted:true}:state(n),passed=attempt?attempt.correct[i]:correct(n,i);return `<article class="card ${reviewed(n)?'':'answer-card'}" data-word-section="${n}" data-word-question="${i+1}" id="${review?'fav'+n+'-':''}q${i}"><div class="eyebrow">SECTION ${String(n).padStart(2,'0')} / QUESTION ${i+1}${review?` · ${questionType(n,i)}`:''}${s.submitted?` <span class="${passed?'good':'bad'}">${passed?'✓ 正确':'× 需复习'}</span>`:''}</div>${reviewed(n)?`<p class="sentence">${escapeHTML(q.t)}</p>`:`<p>第 ${i+1} 题${q.sourceNumber!==i+1?`（原书标号 ${q.sourceNumber}）`:''} · ${kind(n,i)==='equivalent'?'句子等价题，选择两个':kind(n,i)==='multi'?letters(n,i).length+' 空填空题':'单空填空题'}</p><small>请对照${review?'下方':'原书区域的'}题目作答，题目以扫描原页为准。</small>${review||attempt?`<details><summary>查看原题</summary>${sourceImages(n,q.pages)}</details>`:''}`}${q&&!review&&!attempt?`<div class="options">${groups(n,i).map((g,j)=>`<fieldset><legend>${needed(n,i)===2?'选择两个答案':groups(n,i).length>1?'空 '+(j+1):'选择一个答案'}</legend>${g.map(o=>`<label class="option"><input type="${needed(n,i)===2?'checkbox':'radio'}" name="q${i}g${j}" data-i="${i}" data-j="${j}" value="${o[0]}" ${answers(n,i).includes(o[0])?'checked':''} ${s.submitted?'disabled':''}><span>${escapeHTML(o)}</span></label>`).join('')}</fieldset>`).join('')}</div>`:''}${s.submitted||review?explanation(n,i,review||!!attempt,attempt?{answers:attempt.answers[i],reference:attempt.referenceAnswers[i]}:null):''}${review?`<div class="tools"><button data-open="${n}">打开所在 Section</button><button data-remove="${n}-${i}">移出收藏</button></div>`:''}</article>`}
// Vocabulary is part of the same portable progress record as answers and history.
function cleanSelectedWord(text){return String(text||'').normalize('NFKC').trim().replace(/^[^\p{L}\p{M}]+|[^\p{L}\p{M}]+$/gu,'').replace(/\s+/g,' ')}
function validWord(word){return typeof word==='string'&&word.length>0&&word.length<=80&&word.split(/\s+/).length<=8&&/^[\p{L}\p{M}]+(?:[\s’'\-][\p{L}\p{M}]+)*$/u.test(word)}
function validateVocabulary(value=[]){
 if(!Array.isArray(value)||value.length>20000)throw Error('生词表格式无效');const ids=new Set();
 for(const entry of value){
  if(!entry||!validWord(entry.word)||entry.id!==entry.word.toLocaleLowerCase()||ids.has(entry.id)||!Number.isFinite(Date.parse(entry.createdAt))||!Array.isArray(entry.sources)||!entry.sources.length||entry.sources.length>2000)throw Error('生词记录格式无效');ids.add(entry.id);
  for(const src of entry.sources){if(!src||!/^section-([1-9]\d?|1\d\d|200)$|^favorites$/.test(src.pageKey)||!/^section-([1-9]\d?|1\d\d|200)$|^attempt-([1-9]\d?|1\d\d|200)-[A-Za-z0-9-]{1,100}$|^favorites$/.test(src.route)||!(src.section===null||(Number.isInteger(src.section)&&src.section>=1&&src.section<=200))||!(src.question===null||(Number.isInteger(src.question)&&src.question>=1&&src.question<=7))||typeof src.context!=='string'||src.context.length>1200||!Number.isFinite(Date.parse(src.addedAt)))throw Error('生词出处格式无效')}
 }return value
}
function readVocabulary(){try{return validateVocabulary(read('gre-vocabulary-v1',[]))}catch{return []}}
function wordSourceKey(src){return [src.pageKey,src.section||'',src.question||''].join(':')}
function mergeVocabulary(previous=[],incoming=[]){
 const merged=new Map(previous.map(entry=>[entry.id,{...entry,sources:entry.sources.slice()}]));
 for(const entry of incoming){const old=merged.get(entry.id);if(!old){merged.set(entry.id,{...entry,sources:entry.sources.slice()});continue}const sources=new Map(old.sources.map(src=>[wordSourceKey(src),src]));for(const src of entry.sources)if(!sources.has(wordSourceKey(src)))sources.set(wordSourceKey(src),src);old.sources=[...sources.values()];if(entry.createdAt<old.createdAt)old.createdAt=entry.createdAt}
 return [...merged.values()]
}
function wordPageContext(){
 const route=location.hash.slice(1);let match;
 if((match=/^section-(\d+)$/.exec(route))&&questions(+match[1])&&state(+match[1]).submitted)return {pageKey:'section-'+Number(match[1]),section:+match[1],route};
 if((match=/^attempt-(\d+)-(.+)$/.exec(route))&&(state(+match[1]).attempts||[]).some(a=>a.id===match[2]))return {pageKey:'section-'+Number(match[1]),section:+match[1],route};
 if(route==='favorites'&&document.querySelector('#app article'))return {pageKey:'favorites',section:null,route};
 return null
}
function sourceLabel(src){return src.section?'Section '+String(src.section).padStart(2,'0')+(src.question?' · 第 '+src.question+' 题':''):'收藏室'}
function wordSidebarMarkup(){return `<aside class="word-sidebar" aria-label="本页生词"><details open><summary><span class="eyebrow">WORDS TO KEEP</span><span>本页生词 <b id="pageWordCount">0</b></span></summary><p class="word-hint">选中题目、选项或解析中的单词，再点「收藏选词」。</p><div class="word-selection-preview"><span id="wordSelectionText">先选中一个词</span><button id="saveSelectedWord" class="primary" disabled>收藏选词</button></div><div id="pageWordList"></div><a href="#vocabulary" class="word-all-link">查看全部生词 →</a><p class="word-hint">自动保存 · 随练习记录一起备份</p><span id="wordSaveStatus" class="word-status" role="status" aria-live="polite"></span></details></aside>`}
function updateWordSidebar(){
 const list=$('#pageWordList'),ctx=wordPageContext();if(!list||!ctx)return;
 const words=vocabulary.filter(entry=>entry.sources.some(src=>src.pageKey===ctx.pageKey)).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));$('#pageWordCount').textContent=words.length;
 list.innerHTML=words.length?`<ul class="page-word-list">${words.map(entry=>`<li><span><strong>${escapeHTML(entry.word)}</strong><small>${[...new Set(entry.sources.filter(src=>src.pageKey===ctx.pageKey).map(src=>src.question?'第 '+src.question+' 题':'本页'))].join(' · ')}</small></span><button data-word-page-remove="${escapeHTML(entry.id)}" aria-label="将 ${escapeHTML(entry.word)} 移出本页" title="移出本页">×</button></li>`).join('')}</ul>`:'<p class="word-empty">还没有收藏。读到想记住的词，就把它留下。</p>'
}
let selectedWordDraft=null,wordSelectionTimer=null,vocabularyQuery='';
function setSelectedWordDraft(draft){
 selectedWordDraft=draft;const text=$('#wordSelectionText'),button=$('#saveSelectedWord'),popup=$('#wordSelectionPopup');
 if(text)text.textContent=draft?draft.word:'先选中一个词';
 const stored=draft&&vocabulary.some(entry=>entry.id===draft.word.toLocaleLowerCase()&&entry.sources.some(src=>wordSourceKey(src)===wordSourceKey(draft.source)));
 if(button){button.disabled=!draft||stored;button.textContent=stored?'已收藏':'收藏选词'}
 if(!popup)return;popup.hidden=!draft;if(!draft)return;
 const add=popup.querySelector('button');add.textContent=stored?'已收藏「'+draft.word+'」':'收藏「'+draft.word+'」';add.disabled=stored;
 const width=Math.min(300,window.innerWidth-24),top=Math.min(window.innerHeight-60,Math.max(12,draft.rect.bottom+8));popup.style.maxWidth=width+'px';popup.style.left=Math.max(12,Math.min(window.innerWidth-width-12,draft.rect.left))+'px';popup.style.top=top+'px'
}
function captureSelectedWord(){
 const ctx=wordPageContext(),selection=window.getSelection();if(!ctx||!selection||selection.isCollapsed||!selection.rangeCount){setSelectedWordDraft(null);return}
 const range=selection.getRangeAt(0),el=range.startContainer.nodeType===1?range.startContainer:range.startContainer.parentElement,end=range.endContainer.nodeType===1?range.endContainer:range.endContainer.parentElement;
 if(!el?.closest('.word-reading')||!end?.closest('.word-reading')||el.closest('input,textarea,button,[contenteditable=true]')||end.closest('input,textarea,button,[contenteditable=true]')){setSelectedWordDraft(null);return}
 const word=cleanSelectedWord(selection.toString());if(!validWord(word)){setSelectedWordDraft(null);return}
 const article=el.closest('[data-word-section]'),section=article?Number(article.dataset.wordSection):ctx.section,question=article?Number(article.dataset.wordQuestion):null;
 const context=(el.closest('p,.option,li')||el).textContent.replace(/\s+/g,' ').trim().slice(0,1200),rect=range.getBoundingClientRect();
 setSelectedWordDraft({word,source:{pageKey:ctx.pageKey,section,question,route:ctx.route,context,addedAt:new Date().toISOString()},rect:{left:rect.left,bottom:rect.bottom}})
}
function saveSelectedWord(){
 const draft=selectedWordDraft;if(!draft||!wordPageContext())return;const id=draft.word.toLocaleLowerCase();let entry=vocabulary.find(v=>v.id===id);
 if(!entry){entry={id,word:draft.word,createdAt:new Date().toISOString(),sources:[]};vocabulary.unshift(entry)}
 if(!entry.sources.some(src=>wordSourceKey(src)===wordSourceKey(draft.source)))entry.sources.push({...draft.source});
 save();updateWordSidebar();setSelectedWordDraft(draft);if($('#wordSaveStatus'))$('#wordSaveStatus').textContent='已收藏「'+entry.word+'」'
}
function vocabularyView(){
 current=0;return `<div class="heading"><div><div class="eyebrow">YOUR WORD COLLECTION</div><h1>生词表</h1><p>把每次复盘中想记住的词，留在这里。共 <b id="wordTotal">${vocabulary.length}</b> 个生词。</p></div><button data-home>返回练习</button></div><div class="wordbook-search"><label for="vocabularySearch">查找生词</label><input id="vocabularySearch" type="search" value="${escapeHTML(vocabularyQuery)}" placeholder="输入单词或出处 Section" autocomplete="off"><p class="word-hint">交卷后选词收藏；相同词合并显示，保留各处来源。删除会同时移除该词的所有收藏出处。</p></div><div id="vocabularyResults"></div>`
}
function updateVocabularyResults(){
 const results=$('#vocabularyResults');if(!results)return;const query=vocabularyQuery.trim().toLocaleLowerCase(),words=vocabulary.filter(entry=>!query||entry.word.toLocaleLowerCase().includes(query)||entry.sources.some(src=>sourceLabel(src).toLocaleLowerCase().includes(query))).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
 if($('#wordTotal'))$('#wordTotal').textContent=vocabulary.length;
 results.innerHTML=`<p class="word-result-count" role="status">${query?'找到':'已收藏'} ${words.length} 个生词</p>`+(words.length?words.map(entry=>`<article class="card vocabulary-card"><div class="word-card-heading"><h2>${escapeHTML(entry.word)}</h2><button data-word-remove="${escapeHTML(entry.id)}" aria-label="删除生词 ${escapeHTML(entry.word)}">删除</button></div><div class="word-sources">${entry.sources.map(src=>`<div class="word-source"><a href="#${escapeHTML(src.route)}">${sourceLabel(src)}${src.pageKey==='favorites'?' · 来自收藏室':''} →</a>${src.context?`<p>${escapeHTML(src.context)}</p>`:''}</div>`).join('')}</div></article>`).join(''):`<div class="card empty"><h2>${query?'没有找到这个词':'还没有收藏的生词'}</h2><p>${query?'换个词或 Section 编号试试。':'完成一组练习后，选中词语并点击「收藏选词」。'}</p><button data-home>去练习</button></div>`);
 results.querySelectorAll('[data-home]').forEach(button=>button.onclick=()=>go(''))
}
function mountWordbook(){
 setSelectedWordDraft(null);const app=$('#app'),ctx=wordPageContext();document.body.classList.toggle('has-word-sidebar',!!ctx);
 if(ctx){const content=document.createElement('div');content.className='word-reading';while(app.firstChild)content.append(app.firstChild);const layout=document.createElement('div');layout.className='word-reading-layout';layout.append(content);app.append(layout);layout.insertAdjacentHTML('beforeend',wordSidebarMarkup());$('#saveSelectedWord').onclick=saveSelectedWord;$('#saveSelectedWord').onpointerdown=e=>e.preventDefault();updateWordSidebar()}
 if(location.hash==='#vocabulary'){updateVocabularyResults();$('#vocabularySearch').oninput=e=>{vocabularyQuery=e.target.value;updateVocabularyResults()}}
}
function initializeWordbook(){
 $('#wordSelectionPopup')?.remove();const popup=document.createElement('div');popup.id='wordSelectionPopup';popup.className='word-selection-popup';popup.hidden=true;popup.innerHTML='<button class="primary" type="button">收藏选词</button>';popup.onpointerdown=e=>e.preventDefault();popup.querySelector('button').onclick=saveSelectedWord;document.body.append(popup);
 document.addEventListener('selectionchange',()=>{clearTimeout(wordSelectionTimer);wordSelectionTimer=setTimeout(captureSelectedWord,120)});
 document.addEventListener('keydown',event=>{if(event.key==='Escape')setSelectedWordDraft(null)});
 window.addEventListener('scroll',()=>{if(popup&&!popup.hidden)popup.hidden=true},{passive:true});
 document.addEventListener('click',event=>{
  const remove=event.target.closest('[data-word-remove]'),pageRemove=event.target.closest('[data-word-page-remove]');if(!remove&&!pageRemove)return;
  const id=(remove||pageRemove).dataset[remove?'wordRemove':'wordPageRemove'];
  if(remove)vocabulary=vocabulary.filter(entry=>entry.id!==id);else{const ctx=wordPageContext();if(!ctx)return;vocabulary=vocabulary.map(entry=>entry.id!==id?entry:{...entry,sources:entry.sources.filter(src=>src.pageKey!==ctx.pageKey)}).filter(entry=>entry.sources.length)}
  save();setSelectedWordDraft(null);updateWordSidebar();updateVocabularyResults()
 });
 $('#vocabulary').onclick=()=>go('vocabulary')
}

function latestAttempt(n){const s=state(n),list=s.attempts||[],dated=list.filter(a=>a.submittedAt).sort((a,b)=>b.submittedAt.localeCompare(a.submittedAt));return dated[0]||list.find(a=>a.id===s.latestAttemptId)||list[list.length-1]||null}
function mistakeBadge(n){const last=latestAttempt(n),count=last?7-last.score:null;return `<span class="unit-mistakes ${count===null?'mistakes-pending':count===0?'mistakes-clear':'mistakes-found'}"><span>最近错题</span><b>${count===null?'—':count}<small> / 7</small></b></span>`}

 return `<section class="preview-hero"><div><div class="eyebrow">A LITTLE PRACTICE, A CLEARER MIND.</div><h1>先认真做题，<br>再把每一题弄懂<span class="title-dot">。</span></h1><p class="hero-description">为 GRE 填空留一段专注时间。<br>独立完成一个 Section，再一起核对答案、读懂句子。</p><div class="hero-actions"><button class="primary" data-section="1">从 Section 01 开始 <span aria-hidden="true">↗</span></button><a class="text-link" href="#sample">看看交卷后的解析 <span aria-hidden="true">→</span></a></div></div><aside class="study-note"><div class="note-top"><span>YOUR STUDY SPACE</span><span class="note-symbol" aria-hidden="true">✳</span></div><p class="note-caption">每一次复盘，<br>都更接近读懂。</p><div class="note-rule"></div><div class="note-stat"><div><strong>${String(completed).padStart(2,'0')}<small> / 60</small></strong><span>已完成 Section</span></div><div><strong>${String(favoriteCount).padStart(2,'0')}</strong><span>待复习错题</span></div></div><div class="note-foot"><span class="tiny-dot"></span> 一组一组来，不着急。</div></aside></section><div class="workflow-strip"><span><b>01</b> 独立作答</span><i aria-hidden="true">→</i><span><b>02</b> 整组对答案</span><i aria-hidden="true">→</i><span><b>03</b> 中文解析 · 错因复盘</span></div><section class="preview-practice"><div class="section-heading"><div><div class="eyebrow">CHOOSE YOUR SECTION</div><h2>今天，从哪一组开始？</h2></div><span class="section-meta">60 个独立单元 <span>·</span> 共 420 题</span></div><div class="preview-section-grid">${units.map(n=>{const s=state(n),done=Array.from({length:7},(_,i)=>complete(n,i)).filter(Boolean).length;return `<button class="section-card preview-unit ${s.submitted?'unit-complete':''}" data-section="${n}"><div class="unit-top"><span>SECTION</span><span class="unit-arrow" aria-hidden="true">↗</span></div><div class="unit-heading"><strong class="unit-number">${String(n).padStart(2,'0')}</strong>${mistakeBadge(n)}</div><span class="unit-description">7 道填空与等价题<br>${n<=60?'含中文翻译 · 长难句解析':'文字题目 · 整组批改'}</span><div class="unit-progress"><div style="width:${done/7*100}%"></div></div><div class   if(text.trim()){try{incoming=validateProgress(JSON.parse(text))}catch{throw Error('这个文件不是有效的 GRE 练习记录，未写入或覆盖它。')}if(hasProgress()&&!await confirmInline('将连接 '+handle.name+' 并合并记录。已有作答的同一个 Section，以文件中的有效记录为准；其他单元和错因会保留。继续吗？'))return}
  recordFileHandle=handle;recordFileFailed=false;
  if(incoming)mergeProgress(incoming);else save();
  await recordFileQueue
 }catch(error){setRecordFileStatus(recordFileHandle?'保留与 '+recordFileHandle.name+' 的连接':'未能连接记录文件，请使用 JSON 导入或本地自动存档版。','error');showMessage(error.name==='AbortError'?'已取消选择，未连接新的记录文件。':'文件窗口未能打开或授权失败：'+(error.message||error.name))}
}
function initializeRecordFileTools(){
 const panel=$('#recordFilePanel');if(!panel)return;if(window.GRE_BROWSER_STORE&&!window.GRE_BACKEND){panel.hidden=true;return}
 if(window.GRE_BACKEND){
  panel.hidden=false;if($('#browserSavePanel'))$('#browserSavePanel').hidden=true;  recordFileHandle={name:'本机练习记录',createWritable:async()=>{let content='';return {write:async text=>{content=text},close:async()=>{const response=await fetch('/api/progress',{method:'PUT',headers:{'Content-Type':'application/json','X-GRE-Token':window.GRE_SERVER_TOKEN},body:content});if(!response.ok)throw Error('本机记录文件写入失败：'+response.status)},abort:async()=>{}}}};
  panel.querySelectorAll('[data-record-file]').forEach(b=>b.remove());panel.querySelector('small').textContent='每轮成绩、答案与错题自动存入本机；关闭网页或更新程序后可继续。';
  const button=panel.querySelector('[data-save-record-file]');button.disabled=false;button.onclick=()=>queueRecordFileSave();setRecordFileStatus('已连接本机存档。作答与每次交卷都会自动保存。','saved');$('#storageNotice')?.remove();return
 }
 panel.querySelectorAll('[data-record-file]').forEach(button=>{button.disabled=!recordFileSupported();button.onclick=()=>connectRecordFile(button.dataset.recordFile==='new')});
 const saveButton=panel.querySelector('[data-save-record-file]');saveButton.onclick=()=>queueRecordFileSave();
 if(!recordFileSupported())setRecordFileStatus('当前打开方式不支持记录文件连接；请使用 Chrome 普通窗口，或保存带记录的网页。','unsupported');
 else setRecordFileStatus('尚未连接。首次新建一个记录文件；以后打开网页时连接同一个文件。','idle')
}
window.addEventListener('beforeunload',event=>{if(recordFilePending||recordFileFailed){event.preventDefault();event.returnValue=''}});
function openBrowserDatabase(){
 if(browserDatabase)return browserDatabase;
 browserDatabase=new Promise((resolve,reject)=>{if(!window.indexedDB){reject(Error('IndexedDB 不可用'));return}let settled=false;const timer=setTimeout(()=>{if(!settled){settled=true;reject(Error('浏览器记录读取超时'))}},2000);let request;try{request=indexedDB.open(progressKey('gre-practice-browser'),1)}catch(error){clearTimeout(timer);reject(error);return}request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains('records'))request.result.createObjectStore('records')};request.onsuccess=()=>{clearTimeout(timer);if(settled){request.result.close();return}settled=true;resolve(request.result)};request.onerror=()=>{clearTimeout(timer);settled=true;reject(request.error)};request.onblocked=()=>{clearTimeout(timer);settled=true;reject(Error('浏览器记录被其他页面占用'))}});return browserDatabase
}
async function readBrowserDatabase(){const db=await openBrowserDatabase();return new Promise((resolve,reject)=>{const tx=db.transaction('records','readonly'),request=tx.objectStore('records').get('progress');request.onsuccess=()=>resolve(request.result||null);request.onerror=()=>reject(request.error);tx.onabort=()=>reject(tx.error)})}
async function writeBrowserDatabase(serialized){const db=await openBrowserDatabase();await new Promise((resolve,reject)=>{let tx;try{tx=db.transaction('records','readwrite',{durability:'strict'})}catch{tx=db.transaction('records','readwrite')}tx.objectStore('records').put(serialized,'progress');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)});if(await readBrowserDatabase()!==serialized)throw Error('浏览器记录写入校验失败')}
function setBrowserSaveStatus(text,state){const el=$('#browserSaveStatus');if(el){el.textContent=text;el.dataset.state=state}}
function markBrowserSaved(snapshot,revision){if(revision!==browserRevision)return;storageAvailable=true;$('#storageNotice')?.remove();const text=(hasProgress(snapshot)?'已保存本轮作答到本浏览器 · ':'尚未作答 · ')+new Date(snapshot.savedAt).toLocaleTimeString();$('#status').textContent=text;setBrowserSaveStatus(text,'saved')}
function saveBrowserProgress(){
 const revision=++browserRevision,snapshot={...progressSnapshot(),savedAt:new Date().toISOString(),sequence:revision},serialized=JSON.stringify(snapshot);let synchronous=false;
 try{const previous=localStorage.getItem(progressKey('gre-progress-v2'));if(previous){try{const value=JSON.parse(previous);validateProgress(value);if(hasProgress(value))localStorage.setItem(progressKey('gre-progress-last-good-v2'),previous)}catch{}}localStorage.setItem(progressKey('gre-progress-v2'),serialized);if(localStorage.getItem(progressKey('gre-progress-v2'))!==serialized)throw Error('写入未保留');synchronous=true;browserSyncSaved=revision;markBrowserSaved(snapshot,revision)}catch{setBrowserSaveStatus('正在保存到浏览器…','pending')}
 // Preserve the old keys for compatibility. A failure here does not invalidate the verified canonical snapshot.
 try{localStorage.setItem(progressKey('gre-sec1-v1'),JSON.stringify(first));localStorage.setItem(progressKey('gre-sections-2-35-v1'),JSON.stringify(records));localStorage.setItem(progressKey('gre-error-causes-v1'),JSON.stringify(causes));localStorage.setItem(progressKey('gre-vocabulary-v1'),JSON.stringify(vocabulary))}catch{}
 browserPending++;browserWriteQueue=browserWriteQueue.catch(()=>{}).then(async()=>{try{await writeBrowserDatabase(serialized);markBrowserSaved(snapshot,revision);return true}catch{if(!synchronous&&revision===browserRevision){storageAvailable=false;setBrowserSaveStatus('浏览器未能保存，请先下载记录备份再关闭。','error');$('#status').textContent='记录尚未保存，请下载记录备份';showStorageNotice()}return false}finally{browserPending--}})
}
async function loadBrowserProgress(){
 const candidates=[];
 for(const key of ['gre-progress-v2','gre-progress-last-good-v2'])try{const raw=localStorage.getItem(progressKey(key));if(raw){try{const value=JSON.parse(raw);validateProgress(value);candidates.push(value)}catch(error){browserLoadIssues.push('浏览器记录读取失败：'+error.message)}}}catch{}
 try{const raw=await readBrowserDatabase();if(raw){try{const value=JSON.parse(raw);validateProgress(value);candidates.push(value)}catch(error){browserLoadIssues.push('浏览器备份读取失败：'+error.message)}}}catch{}
 // An empty startup snapshot must never take precedence over real practice records.
 candidates.sort((a,b)=>Number(hasProgress(b))-Number(hasProgress(a))||(b.savedAt||'').localeCompare(a.savedAt||'')||(b.sequence||0)-(a.sequence||0));
 if(candidates.length){const value=candidates[0],parsed=validateProgress(value);first=parsed.section1;records=parsed.sections;causes=parsed.causes;vocabulary=parsed.vocabulary;browserRevision=value.sequence||0;storageAvailable=true;
  if(hasProgress(value)){const rounds=(first.attempts||[]).length+Object.values(records).reduce((sum,s)=>sum+(s.attempts||[]).length,0);setBrowserSaveStatus('已恢复本浏览器记录 · '+rounds+' 轮交卷记录','saved')}
  else setBrowserSaveStatus('当前打开位置没有找到已有练习记录','ready')
 }else if(browserLoadIssues.length){setBrowserSaveStatus('旧记录读取失败，未覆盖原数据','error');showMessage(browserLoadIssues.join('；')+'。原记录未覆盖，请先不要重新作答。')}
 else setBrowserSaveStatus(hasProgress()?'已读取早期版本记录':'当前打开位置没有找到已有练习记录','ready')
}
function progressSnapshot(){return {format:'gre-all-v1',date:new Date().toISOString(),sections:records,section1:JSON.stringify(first),causes,vocabulary}}
function sectionHasProgress(s,isFirst=false){return !!(s&&(s.submitted||s.firstGraded||s.firstScore!=null||s.favorites?.length||s.attempts?.length||(isFirst?s.sel?.some(g=>g.some(a=>a.length)):s.answers?.some(a=>a.length))))}
function hasProgress(value=progressSnapshot()){return sectionHasProgress(typeof value.section1==='string'?JSON.parse(value.section1):value.section1,true)||Object.values(value.sections||{}).some(s=>sectionHasProgress(s))||Object.keys(value.causes||{}).length>0||(value.vocabulary||[]).length>0}
function validateProgress(v){
 const validFavorite=a=>Array.isArray(a)&&a.every(i=>Number.isInteger(i)&&i>=0&&i<7);
 const validScore=s=>s==null||(Number.isInteger(s)&&s>=0&&s<=7);
 const validLetters=a=>Array.isArray(a)&&a.every(x=>typeof x==='string'&&/^[A-I]$/.test(x))&&new Set(a).size===a.length;
 const validateHistory=s=>{if(s.attempts===undefined)return;if(!Array.isArray(s.attempts))throw Error('练习历史格式无效');const ids=new Set();for(const a of s.attempts){if(!a||typeof a.id!=='string'||!/^[A-Za-z0-9-]{1,100}$/.test(a.id)||ids.has(a.id)||a.total!==7||!validScore(a.score)||a.score==null||!Array.isArray(a.answers)||a.answers.length!==7||!a.answers.every(v=>validLetters(v)&&v.length<=3)||!Array.isArray(a.correct)||a.correct.length!==7||!a.correct.every(v=>typeof v==='boolean')||a.correct.filter(Boolean).length!==a.score||!Array.isArray(a.referenceAnswers)||a.referenceAnswers.length!==7||!a.referenceAnswers.every(v=>validLetters(v)&&v.length>=1&&v.length<=3)||(a.submittedAt!==null&&(typeof a.submittedAt!=='string'||!Number.isFinite(Date.parse(a.submittedAt)))))throw Error('练习历史条目无效');ids.add(a.id)}};
 const validateFirst=f=>{if(!f||typeof f!=='object'||Array.isArray(f))throw Error('Section 1 记录格式无效');if(f.sel&&(!Array.isArray(f.sel)||f.sel.length!==7||!f.sel.every((g,i)=>Array.isArray(g)&&g.length===questions(1)[i].g.length&&g.every((a,j)=>validLetters(a)&&a.length<=questions(1)[i].a[j].length))))throw Error('Section 1 作答格式无效');if(f.favorites&&!validFavorite(f.favorites))throw Error('收藏题号无效');if(!validScore(f.firstScore))throw Error('成绩格式无效');validateHistory(f);return f};
 if(v?.version===1&&v.state)return {scope:'section1',section1:validateFirst(v.state),sections:{},causes:{},vocabulary:[]};
 if(v?.format!=='gre-all-v1'||!v.sections||typeof v.sections!=='object'||Array.isArray(v.sections))throw Error('备份格式无效，请选择练习记录 JSON 或带记录的网页');
 for(const [n,s] of Object.entries(v.sections)){if(!Number.isInteger(+n)||+n<2||+n>200||!s||!Array.isArray(s.answers)||s.answers.length!==7||!s.answers.every(a=>validLetters(a)&&a.length<=3)||!validFavorite(s.favorites)||typeof s.submitted!=='boolean'||!validScore(s.firstScore))throw Error('Section '+n+' 的记录格式无效');validateHistory(s)}
 const f=validateFirst(v.section1?(typeof v.section1==='string'?JSON.parse(v.section1):v.section1):{}),c=v.causes||{};
 if(typeof c!=='object'||Array.isArray(c)||!Object.entries(c).every(([k,a])=>/^([1-9]|[1-9]\d|1\d\d|200)-[0-6]$/.test(k)&&Array.isArray(a)&&a.every(t=>['单词不会','句法错误'].includes(t))))throw Error('错因标签格式无效');
 return {scope:'all',sections:v.sections,section1:f,causes:c,vocabulary:validateVocabulary(v.vocabulary||[])}
}
function mergeAttempts(old=[],incoming=[]){const map=new Map(old.map(a=>[a.id,a]));for(const a of incoming)if(!map.has(a.id))map.set(a.id,a);return [...map.values()]}
function mergeSection(previous,incoming){if(!previous)return incoming;const chosen=sectionHasProgress(incoming)?incoming:previous;return {...chosen,attempts:mergeAttempts(previous.attempts,incoming.attempts),favorites:[...new Set([...(previous.favorites||[]),...(incoming.favorites||[])])]}}
function mergeProgress(value){
 const combinedFirst=mergeAttempts(first.attempts,value.section1.attempts);if(sectionHasProgress(value.section1,true))first={...value.section1,attempts:combinedFirst,favorites:[...new Set([...(first.favorites||[]),...(value.section1.favorites||[])])]};else first.attempts=combinedFirst;
 if(value.scope!=='section1'){
  for(const [n,s] of Object.entries(value.sections))if(sectionHasProgress(s)||!records[n])records[n]=mergeSection(records[n],s);
  for(const [id,tags] of Object.entries(value.causes))causes[id]=[...new Set([...(causes[id]||[]),...tags])];
  vocabulary=mergeVocabulary(vocabulary,value.vocabulary||[]);
 }
 for(let n=1;n<=answerBank.sections.length;n++)if(state(n).submitted)archiveAttempt(n,true);
 save();render()
}
async function restoreProgress(value){
 if(!await confirmInline('将合并导入作答、收藏、生词表和错因标签。同一个 Section 有两份作答时，以导入的有效记录为准；没有作答的空记录不会覆盖当前进度。继续吗？'))return;
 previousImport=JSON.parse(JSON.stringify(progressSnapshot()));try{localStorage.setItem(progressKey('gre-before-restore-v1'),JSON.stringify(previousImport))}catch{}
 mergeProgress(value);$('#status').textContent=storageAvailable?'记录已合并恢复；如需撤销，请打开“找回旧版记录”':'记录已载入当前页面，但浏览器未能保存，请立即下载备份'
}
function attachedProgress(){const node=document.getElementById('gre-carried-progress');if(!node)return null;try{return validateProgress(JSON.parse(node.textContent))}catch{return null}}
function legacyProgress(){if(!window.GRE_STORAGE_PREFIX)return null;try{const v={format:'gre-all-v1',sections:JSON.parse(localStorage.getItem('gre-sections-2-35-v1')||'{}'),section1:localStorage.getItem('gre-sec1-v1')||'{}',causes:JSON.parse(localStorage.getItem('gre-error-causes-v1')||'{}'),vocabulary:JSON.parse(localStorage.getItem('gre-vocabulary-v1')||'[]')};return hasProgress(v)?validateProgress(v):null}catch{return null}}
function progressHelp(){return `<div class="heading"><div><div class="eyebrow">YOUR PRACTICE RECORDS</div><h1>找回我的练习记录</h1><p>记录保存在浏览器中。新下载文件的名称、位置或打开方式变化时，可能无法读取旧网页的记录。</p></div><button data-home>返回练习</button></div><section class="card"><h2>旧版还能看到记录</h2><ol class="recovery-steps"><li>使用原来的浏览器，打开上一个版本的 HTML 文件。</li><li>在旧版页面底部点击「下载练习记录」。</li><li>回到这里，导入刚下载的 JSON 文件，恢复作答、收藏、生词表和错因。</li></ol><button class="primary" data-import-progress>导入旧版练习记录</button><p class="muted">也兼容最早版本的 Section 1 单组备份。导入空白单元不会覆盖已有进度。</p></section><section class="card"><h2>其他恢复入口</h2><div class="tools"><button data-restore-attached ${attachedProgress()?'':'disabled'}>恢复本网页附带的记录</button><button data-restore-legacy ${legacyProgress()?'':'disabled'}>读取当前浏览器的早期版本记录</button><button data-undo-import>撤销上次记录导入</button></div><p class="muted">这些入口只读取当前网页有权访问的数据，无法跨文件直接读取另一个旧网页的浏览器存储。不要清除浏览器数据；如果旧版和备份都没有可读记录，目前无法保证恢复。</p></section>${window.GRE_PREVIEW?'<section class="card"><h2>以后更新时，把记录一起带走</h2><p>离开或更新前，点击「保存带记录的网页」。下载的新 HTML 会附带当前练习记录，在新文件中打开时可自动恢复。</p><button data-portable-progress>保存带记录的网页</button><p class="muted">也可继续使用 JSON 记录备份。更换浏览器或设备时，同样可以导入。</p></section>':''}`}
function downloadBlob(content,type,name){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportPortablePage(){
 const copy=document.documentElement.cloneNode(true);copy.querySelector('#gre-carried-progress')?.remove();copy.querySelector('#storageNotice')?.remove();copy.querySelector('#wordSelectionPopup')?.remove();copy.querySelector('#app').innerHTML='';
 const payload=document.createElement('script');payload.type='application/json';payload.id='gre-carried-progress';payload.textContent=JSON.stringify(progressSnapshot()).replace(/</g,'\\u003c');copy.querySelector('head').append(payload);
 downloadBlob('<!doctype html>\n'+copy.outerHTML,'text/html;charset=utf-8','GRE-Section-1-5-我的记录.html');$('#status').textContent='已下载带记录的网页；请保留该文件，更新前也可另存 JSON 备份'
}
function showStorageNotice(){if(storageAvailable||$('#storageNotice'))return;const notice=document.createElement('div');notice.id='storageNotice';notice.className='storage-notice';notice.setAttribute('role','alert');notice.innerHTML='当前浏览器无法自动保存练习记录。离开前请下载记录备份'+(window.GRE_PREVIEW?'或保存带记录的网页':'')+'。';document.querySelector('header').after(notice)}
function bindProgressTools(){
 document.querySelectorAll('[data-import-progress]').forEach(b=>b.onclick=()=>$('#import').click());
 document.querySelectorAll('[data-portable-progress]').forEach(b=>{b.hidden=!!window.GRE_BACKEND;b.onclick=exportPortablePage});

 document.querySelectorAll('[data-undo-import]').forEach(b=>b.onclick=async()=>{const raw=previousImport||read('gre-before-restore-v1',null);if(!raw){showMessage('当前网页没有可撤销的导入记录');return}const v=validateProgress(raw);if(!await confirmInline('恢复到上次导入前的记录？导入之后的新作答将被替换。'))return;first=v.section1;records=v.sections;causes=v.causes;vocabulary=v.vocabulary||[];save();render()})
}
$('#favorites').onclick=()=>go('favorites');$('#home').onclick=()=>go('');if($('#history'))$('#history').onclick=()=>go('history');$('#export').onclick=()=>downloadBlob(JSON.stringify(progressSnapshot(),null,2),'application/json','gre-practice-backup.json');
$('#import').onchange=async e=>{try{if(!e.target.files[0])return;const text=await e.target.files[0].text();let data;if(text.trim().startsWith('<')){const node=new DOMParser().parseFromString(text,'text/html').getElementById('gre-carried-progress');if(!node)throw Error('这份旧网页本身没有附带记录。请用原浏览器打开旧网页，点击“下载练习记录”，再导入 JSON 文件。');data=JSON.parse(node.textContent)}else data=JSON.parse(text);await restoreProgress(validateProgress(data))}catch(error){showMessage(error.message||'无法读取备份，现有记录未修改')}finally{e.target.value=''}};
window.addEventListener('hashchange',()=>{if(!window.GRE_READY)return;render();window.scrollTo(0,0)});

async function startApplication(){
 const loading=window.GRE_BROWSER_STORE&&!window.GRE_BACKEND;
 if(loading){$('#app').innerHTML='<p class="muted" style="padding:32px 0">正在读取本浏览器的练习记录…</p>';document.querySelectorAll('header button,.toolbar button,.toolbar input').forEach(el=>el.disabled=true);await loadBrowserProgress()}
 else try{const probe=progressKey('gre-storage-probe-'+Date.now()+'-'+Math.random());localStorage.setItem(probe,'1');localStorage.removeItem(probe)}catch{storageAvailable=false}
 const carried=attachedProgress();if(carried&&!hasProgress())mergeProgress(carried);
 let migratedAttempts=false;for(let n=1;n<=answerBank.sections.length;n++)if(state(n).submitted&&archiveAttempt(n,true))migratedAttempts=true;
 document.querySelectorAll('header button,.toolbar button,.toolbar input').forEach(el=>el.disabled=false);window.GRE_READY=true;initializeWordbook();render();initializeRecordFileTools();
 if(loading){if(migratedAttempts&&hasProgress())saveBrowserProgress();if(navigator.storage?.persist)navigator.storage.persist().catch(()=>{})}
 else{if(migratedAttempts)save();showStorageNotice();if(window.GRE_BACKEND&&migratedAttempts)queueRecordFileSave()}
}
startApplication();
