览器；请下载备份，关闭浏览器通常不会丢失，清除数据或换设备可能丢失。</p><div id="favoriteView" hidden></div><div id="app"></div></main><script>
const section1Questions=[
{t:'Scientists have argued not only that the chains of atoms called ladder compounds have _____ theoretical interest but also that studies of such systems can lead to important practical applications.',g:[['A. limited','B. dubious','C. superfluous','D. unidimensional','E. intrinsic']],a:[['E']],e:'not only … but also … 并列两种价值：自身的理论价值和重要的实际应用。intrinsic 表示“内在的、固有的”。'},
{t:'Although the vast weight of evidence supports the contention that the products of agricultural biotechnology are environmentally (i) _____, many people still find them (ii) _____ unsettling.',g:[['A. destructive','B. sound','C. intriguing'],['D. retroactively','E. innocuously','F. intrinsically']],a:[['B'],['F']],e:'Although 和 still 表示反差：证据表明对环境无害（sound），许多人仍觉得产品本身（intrinsically）令人不安。'},
{t:'It is possible for human to go 40 or more hours without sleep and still be able to (i) _____ information acquired at the beginning of the sleepless period. Thus, when we are considering a role for sleep in human memory consolidation, we are referring to a possible role in the (ii) _____ encoding of information and optimizing of recall, not a (iii) _____ of sleep for recalling events of the prior day.',g:[['A. legitimate','B. augment','C. disgorge'],['D. longer-term','E. acute','F. qualitative'],['G. requirement','H. surplus','I. facet']],a:[['C'],['D'],['G']],e:'即使不睡也能回忆信息（disgorge，此处指说出或回吐信息），所以睡眠不是回忆前一天事件的必要条件（requirement）；它可能有助于更长期的（longer-term）编码与优化回忆。'},
{t:'Not only is the advent of bookless or largely bookless libraries too large and powerful a change to be _____, it also offers too many real advantages for it to be considered a tragedy.',g:[['A. understood','B. averted','C. foreseen','D. forestalled','E. endured','F. anticipated']],a:[['B','D']],e:'too large and powerful … to be 表示变化太大、太强势，无法阻止。averted 和 forestalled 都有“防止、阻止”之意。'},
{t:'Although men still dominate the ranks of full professors in the field of astronomy, the increasing numbers of younger women in the field could _____ a change in its gender mix.',g:[['A. require','B. alleviate','C. block','D. presage','E. portend','F. hinder']],a:[['D','E']],e:'尽管目前男性仍占主导，年轻女性人数上升可能预示将来的性别构成发生变化。presage 和 portend 均表示“预示”。'},
{t:'The life of a secret agent is dangerous enough, but the life of a double agent is infinitely more _____: a single slip can send an agent crashing to destruction.',g:[['A. arduous','B. precarious','C. clandestine','D. perilous','E. covert','F. exhilarating']],a:[['B','D']],e:'冒号后解释：一个失误就可能导致毁灭，因此双重间谍更危险。precarious 意为危险的、不稳定的；perilous 意为危险的。'},
{t:'An apparent paradox led the scientists to pursue their present line of research. They were struck by the fact that a single mathematic formula can be used to describe physical phenomena that appear to be so _____.',g:[['A. rudimentary','B. interdependent','C. interrelated','D. complex','E. heterogeneous','F. dissimilar']],a:[['E','F']],e:'paradox 的反差是：一个公式能描述看似非常不同的现象。heterogeneous 和 dissimilar 都表示不同的、异质的。'}];

const section2=[
{t:"Some ethicists worry that a deeper understanding of the brain may be tantamount to _____: if we discover that free will is an illusion of neural circuitry, how will we hold people responsible for their actions?",o:["A. vindication","B. proscription","C. ministration","D. valediction","E. exculpation"],translation:"一些伦理学家担心，对大脑更深入的理解可能等同于开脱罪责：如果我们发现自由意志只是神经回路产生的幻象，我们还能如何让人们为自己的行为负责？",grammar:"主句主干：Some ethicists worry that ...；that 引导担心的内容。从句主语是 a deeper understanding of the brain，谓语是 may be，tantamount to 意为“等同于”。冒号后用 if 条件句和一个问句解释前面的担忧。",reason:"冒号解释担忧：如果人没有自由意志，人们可能无法为行为负责，即获得开脱。E exculpation 表示“开脱罪责”。A vindication 是证明清白或正确；B proscription 是禁止；C ministration 是照料；D valediction 是告别辞。"},
{t:"Scholarly works on detective stories often begin with (i) _____, suggesting that there is something vaguely wrong with adults who spend their time reading such fiction and certainly something (ii) _____ those who devote energy to its analysis.",o:["A. chronologies","B. apologies","C. synopses","D. awry in","E. astute about","F. courageous about"],translation:"关于侦探小说的学术著作常常以道歉开头，仿佛成年人花时间阅读这类小说有些不对劲，而花精力分析这类小说的人肯定更不对劲。",grammar:"主干：Scholarly works ... often begin with ...。suggesting ... 是现在分词短语，说明这种开头暗示了什么。that 后有两个并列的 something 结构；who spend ... 修饰 adults，who devote ... 修饰 those。",reason:"something vaguely wrong 提示负面评价；and certainly 延续并加强它，因此第二空选 D awry in（有问题）。如果作者认为这种研究不太体面，以道歉开头也合理，第一空选 B apologies。A 是年表，C 是梗概；E astute 是敏锐的，F courageous 是勇敢的，都与负面评价不符。"},
{t:"So, perhaps the lesson is that rather than wanting their monarchy to (i) _____ its modernized Scandinavian counterparts, the British public cherishes it most when it is most (ii) _____.",o:["A. discount","B. emulate","C. commend","D. egalitarian","E. anachronistic","F. regal"],translation:"所以，或许我们可以得出的结论是：英国民众并不希望本国君主制仿效现代化的斯堪的纳维亚君主制；相反，当它最显得不合时宜时，民众反而最珍视它。",grammar:"主干：the lesson is that ...；that 引导表语从句。rather than wanting ... 表示“不是希望……”，其后 the British public cherishes it most 是从句主干。when it is most ... 是时间状语从句；it 指英国的君主制。",reason:"rather than 建立对比：英国民众不是希望君主制变得像现代化的北欧同行，而是在其最不现代时最珍视它。B emulate 意为仿效；E anachronistic 意为不合时代的。A discount 是轻视，C commend 是称赞；D egalitarian 是平等主义的，F regal 是王室气派的，但与 modernized 构成的反差不如 E 明确。"},
{t:"Although political events in different countries were not (i) _____ in the 19th century, their interrelationship was (ii) _____ compared with the present, when interdependence has become far greater: (iii) _____ ceased to be an option.",o:["A. unconnected","B. trivial","C. simultaneous","D. conditional","E. superficial","F. transparent","G. isolationism","H. resilience","I. idealism"],translation:"尽管在19世纪，不同国家的政治事件并非毫无联系，但与相互依存程度高得多的今天相比，它们之间的联系是表面的：孤立主义已不再是一个选项。",grammar:"Although 引导让步状语从句：events were not ...。主句是 their interrelationship was ... compared with the present。when 引导定语从句，补充说明 the present；冒号后说明当代相互依存加深的结果。注意 not 与第一空共同决定含义。",reason:"虽然过去并非没有联系（not unconnected），但与现在相比联系较浅（superficial）。如今相互依存更强，所以孤立主义（isolationism）不再可行。依次选 A、E、G。注意不要漏掉 not：not unconnected 表示“并非没有联系”。"},
{t:"Well organized and researched and including all significant discoveries of medical scientists, the History of Western Medicines has been justly called _____.",o:["A. encyclopedic","B. long-winded","C. exhaustive","D. rambling","E. overbearing","F. undiscriminating"],translation:"《西方医学史》组织严谨、研究充分，并涵盖医学科学家的所有重要发现，因此被称为内容全面是恰当的。",grammar:"主句主干是 the History of Western Medicines has been justly called ...。句首 Well organized and researched 以及 including ... 是前置的描述性成分，共同修饰书名。",reason:"including all significant discoveries 表明涵盖全面，A encyclopedic（百科全书式的、广博的）和 C exhaustive（详尽的、全面的）符合。B long-winded 冗长的，D rambling 散漫的，E overbearing 专横的，F undiscriminating 不加区分的。"},
{t:"Science is arguably a very high-minded pursuit, but that is not to say that all of its practitioners are _____, as numerous articles alleging overly generous pharmaceutical industry payments have tried to show.",o:["A. conventional","B. clever","C. unimpeachable","D. ingenious","E. blameless","F. predictable"],translation:"科学可以说是一项崇高的事业，但这并不是说所有从业者都无可指责；许多指称制药业支付过于慷慨的文章试图说明这一点。",grammar:"but 连接两个分句；that 指前面科学是一项崇高事业这件事。that is not to say that ... 意为“这并不是说……”。as 引导后面的补充说明，articles 是主语，alleging ... 修饰 articles，have tried 是谓语。",reason:"前半句承认科学崇高，but 后提醒从业者不一定同样无可指责；后面的药企付款指控提供线索。C unimpeachable 和 E blameless 都表示无可指责的。A conventional 传统的；B clever 聪明的；D ingenious 有巧思的；F predictable 可预测的。"},
{t:"In a field of egotists, Bloomfield is _____, always praising her competitors and punctuating her correspondence with self-deprecating remarks.",o:["A. unassuming","B. complimentary","C. acerbic","D. ingenuous","E. cutting","F. modest"],translation:"在一个自我中心者云集的领域里，布卢姆菲尔德十分谦逊：她总是称赞竞争对手，并在通信中不时穿插自嘲的话。",grammar:"主句是 Bloomfield is ...；In a field of egotists 是背景状语。逗号后的 always praising ... and punctuating ... 是两个并列的现在分词短语，说明她的表现。her correspondence 是她的通信；with self-deprecating remarks 表示穿插自嘲的话。",reason:"称赞对手和自嘲说明她谦逊，与 egotists 形成对比。A unassuming 和 F modest 均为谦逊的。B complimentary 是称赞人的，但只对应其中一个行为；C acerbic 和 E cutting 是尖刻的；D ingenuous 是坦率天真的。"}];
const section3=[
{"t":"In the nineteenth century, geology became so respected among middle-class Britons that the science came to be seen as _____, a yardstick by which other disciplines measured their scientific rigor and imaginative power.","o":["A. accessible","B. derivative","C. pragmatic","D. empirical","E. paradigmatic"],"translation":"19世纪，地质学在英国中产阶级中变得如此受人尊重，以至于它被视为一种典范，其他学科借此衡量自身的科学严谨性和想象力。","grammar":"主干是 geology became so respected ... that ...；so ... that ... 表示‘如此……以至于……’。a yardstick 是对前面评价的补充说明；by which 引导定语从句，修饰 yardstick。","reason":"逗号后说其他学科以它为衡量标准，说明地质学是典范，故选 E paradigmatic（典范性的）。accessible 易接近的；derivative 衍生的；pragmatic 务实的；empirical 经验性的。"},
{"t":"Up to the 1970s, histories of science tended to be (i) _____, not least in their focus on discoveries and theories that could be read as anticipating later scientific orthodoxies, rather than on those deemed (ii) _____ in their own periods. Historians of science are now routinely far more sensitive on such scores.","o":["A. anachronistic","B. convoluted","C. undogmatic","D. major","E. fallacious","F. inessential"],"translation":"直到20世纪70年代，科学史著作往往带有时代错置的倾向，尤其表现为关注那些可以被解读为预示后来科学正统观点的发现和理论，而不是关注在它们各自时代被认为重要的发现和理论。如今科学史家在这类问题上通常敏感得多。","grammar":"主干是 histories of science tended to be ...。not least in ... 指出这种倾向的一个重要表现。that could be read ... 修饰 discoveries and theories；rather than 连接两种关注对象，those 指代前述发现和理论；deemed ... in their own periods 修饰 those。","reason":"过去作者用后来的正统观点评价早期发现，属于时代错置，选 A anachronistic；与此相对，另一种关注对象是在当时被认为重要的理论，选 D major。B convoluted 费解的，C undogmatic 不教条的；E fallacious 错误的，F inessential 不重要的。"},
{"t":"The perennial problem for critics of nineteenth-century novelist Charlotte Yonge is the relationship of her realism to her (i) _____. While admiring her complex psychological portraits and detailed descriptions of quotidian family life, readers since her own time have tended to fault her improbable manipulation of plot to teach a moral lesson. Indeed, many critics (ii) _____ her because of her willingness to (iii) _____.","o":["A. pessimism","B. didacticism","C. eclecticism","D. dismiss","E. applaud","F. underestimate","G. squander suspense","H. sacrifice credibility","I. deflate pretension"],"translation":"对于研究19世纪小说家夏洛特·扬的评论者来说，一个长期存在的问题是她的现实主义与说教倾向之间的关系。尽管读者欣赏她复杂的心理刻画和对日常家庭生活的细致描写，但自她所处的时代以来，读者往往批评她为了传授道德教训而不合情理地操纵情节。事实上，许多评论者因她愿意牺牲可信性而否定她。","grammar":"首句主干是 The perennial problem ... is the relationship ...。While admiring ... 的逻辑主语是 readers；主句 readers ... have tended to fault ...。to teach a moral lesson 表目的。最后一句 because of 引出原因，her willingness to ... 指她愿意做某事。","reason":"teach a moral lesson 对应 B didacticism（说教倾向）；fault 和 improbable 指批评者反对牺牲故事的可信性，选 D dismiss（否定）和 H sacrifice credibility（牺牲可信性）。其余选项分别为悲观主义、折中主义；赞扬、低估；浪费悬念、挫抑自负。"},
{"t":"Some have argued that naming scientific discoveries after the people who make them can _____ scientific progress, because the nomenclature lacks useful clarity, having no relationship to the underlying principles that govern nature.","o":["A. hamper","B. abet","C. instigate","D. obscure","E. nullify","F. impede"],"translation":"有人认为，以发现者的名字命名科学发现可能阻碍科学进展，因为这种命名缺乏有用的清晰度，与支配自然的基本原理没有关系。","grammar":"主干是 Some have argued that ...。that 从句中，naming scientific discoveries after ... 是动名词主语；who make them 修饰 people。because 引出原因；having no relationship ... 说明这种命名的特点。","reason":"because 后给出缺乏清晰度这一不利因素，因此前面需要‘阻碍进展’。A hamper 和 F impede 均表示阻碍；B abet 和 C instigate 是协助或促使，D obscure 是使模糊，E nullify 是使无效。"},
{"t":"In the wild, no other mammal _____ individuals from another species; badgers do not tend hares, deer do not nurture baby squirrels, lions do not care for giraffes.","o":["A. protects","B. fosters","C. aids","D. cajoles","E. adopts","F. coaxes"],"translation":"在野外，没有其他哺乳动物会收养或抚育另一物种的个体；獾不会照料野兔，鹿不会养育小松鼠，狮子也不会照顾长颈鹿。","grammar":"前半句主干为 no other mammal ... individuals；from another species 修饰 individuals。分号后列举三个并列例子，解释前面的概括；tend、nurture 和 care for 提供语义线索。","reason":"例子讲照料、养育别的物种的个体，故选 B fosters（抚养）和 E adopts（收养）。A protects 是保护，C aids 是帮助，范围太宽；D cajoles 和 F coaxes 是哄劝。"},
{"t":"Each of the country's 26 states and most of its more than 2,000 municipalities have their own police forces, _____ communication and making it difficult to establish a coordinated law-enforcement strategy.","o":["A. establishing","B. impeding","C. hampering","D. launching","E. obscuring","F. preventing"],"translation":"该国26个州中的每一个，以及其两千多个市镇中的大多数，都拥有各自的警察部队，这阻碍了沟通，也使得制定统一协调的执法战略变得困难。","grammar":"主语是 Each ... and most ...，谓语是 have，宾语是 their own police forces。逗号后的两个现在分词短语与 making 并列，说明这种情况造成的结果；it 是形式宾语，to establish ... 是真正内容。","reason":"and 连接两个方向一致的结果：既然协调执法策略困难，沟通也受到阻碍。B impeding 和 C hampering 均为妨碍；A establishing、D launching 是建立或启动；E obscuring 是使模糊；F preventing 表示完全阻止，语义更强。"},
{"t":"Governments are often willing to pay the direct costs of preparing for emergencies that may never happen: they make room in their budgets to prepare for _____ but unlikely events.","o":["A. plausible","B. anticipated","C. dangerous","D. conceivable","E. foreseen","F. unimaginable"],"translation":"政府往往愿意支付为可能永远不会发生的紧急情况做准备的直接费用：它们在预算中留出空间，为可能发生但不太可能发生的事件做准备。","grammar":"第一分句主干是 Governments are often willing to pay ...；that may never happen 修饰 emergencies。冒号后的分句解释这一行为；to prepare for ... 是目的状语，but 连接两个有反差的特征。","reason":"may never happen 和 unlikely 表示不太可能，但政府仍为之做准备，说明事件可以设想、存在可能性。A plausible 和 D conceivable 符合；B anticipated、E foreseen 偏向预期会发生；C dangerous 不与另一选项构成同义对；F unimaginable 与可设想相反。"}
]
;
const section4=[{"t":"The identity of hominid remains found in a cave in the Altai Mountains was _____ until Paabo and his colleagues ended the speculation by showing that DNA sequences indicated the bones belonged to Neanderthals.","o":["A. extraneous","B. conjectural","C. improbable","D. demonstrable","E. consistent"],"translation":"在帕博和同事通过 DNA 序列表明这些骨骼属于尼安德特人、结束猜测之前，在阿尔泰山脉一个洞穴中发现的古人类遗骸身份一直只是推测。","grammar":"主干是 The identity ... was ... until ...。found in a cave ... 修饰 remains；until 引出猜测结束的时间。by showing ... 说明如何结束猜测；that 从句说明 DNA 序列显示的内容。","reason":"until ... ended the speculation 表示此前仍是猜测，B conjectural（推测性的）符合。A 无关的，C 不大可能的，D 可证明的，E 一致的。"},
{"t":"Some novelists immodestly idealized and exaggerate the significance of their work, but others, _____ to exalt the role of the writer, question a transcendent view of the art.","o":["A. averring","B. declining","C. seeking","D. feigning","E. avowing"],"translation":"有些小说家不谦虚地将自己的作品理想化并夸大其意义；但另一些人不愿颂扬作家的角色，对这种艺术至高无上的看法提出质疑。","grammar":"but 连接对比的两类小说家。后一分句主语 others，谓语 question；插入的 ... to exalt ... 修饰 others。原稿中 idealized 与 exaggerate 的时态形式不一致，这里保留原文。","reason":"后半句 question a transcendent view 与前面的夸大形成对比，故这些人不愿抬高作家地位，选 B declining（不愿、拒绝）。A averring 和 E avowing 表示断言；C seeking 试图；D feigning 假装。"},
{"t":"The economic recovery was somewhat lopsided: (i) _____ in some of the industries economics while (ii) _____ in others of them.","o":["A. unexpected","B. feeble","C. swift","D. robust","E. turbulent","F. predictable"],"translation":"经济复苏有些不均衡：某些行业复苏乏力，而另一些行业则强劲。","grammar":"主句为 The economic recovery was somewhat lopsided；冒号后解释不均衡，while 连接两种相对照的情况。原稿中的 ‘industries economics’ 表述疑似有误，此处保留原样，翻译依据上下文解释。","reason":"lopsided 和 while 要求两处呈相反程度；B feeble（疲弱）与 D robust（强劲）形成对比。A 意外的，C 迅速的；E 动荡的，F 可预测的。"},
{"t":"Inuit print making is less (i) _____ than carving in that it does not have substantial historical precedents, although there are (ii) _____ incised carvings on bone or antler, facial tattoo marks, or inlay skin work on clothing, mitts and footwear. Carving materials such as stone, bone, antler, wood, and ivory were (iii) _____, but paper and drawing tools were unknown until introduced by early explorers and missionaries.","o":["A. traditional","B. prestigious","C. anomalous","D. affinities with","E. objections to","F. regulations about","G. available locally","H. rarely used","I. virtually interchangeable"],"translation":"因纽特版画不如雕刻传统悠久，因为它没有大量历史先例，尽管它与骨头或鹿角上的刻画、面部纹身或衣物、手套及鞋上的嵌皮工艺有相似之处。石头、骨头、鹿角、木材和象牙等雕刻材料在当地可以获得，但纸张和绘画工具直到早期探险者和传教士引入后才为人所知。","grammar":"主句是 print making is less ... than carving；in that 引出原因，although 引出让步。第二句 but 对比雕刻材料与纸张工具的可获得性。until introduced ... 省略了 paper and drawing tools were。","reason":"没有历史先例说明版画较不传统，选 A traditional；although 引出虽无先例却有相似关系，选 D affinities with；but 后说纸张直到外来者引入才被认识，与之对比雕刻材料在当地可获得，选 G available locally。"},
{"t":"Scientists should hope the faults in their theories will be _____ their peers since the refutation of one hypothesis can free its originator to develop a better one.","o":["A. discerned by","B. disregarded by","C. discovered by","D. ignored by","E. opaque to","F. inspiring to"],"translation":"科学家应希望同行发现其理论中的缺陷，因为一个假说被驳斥可以使其提出者摆脱原假说，发展出更好的理论。","grammar":"主干是 Scientists should hope ...；hope 后省略 that 的宾语从句以 faults 为主语。since 引出原因；the refutation of one hypothesis 是原因从句的主语。","reason":"既然驳斥旧假说能促进新理论，科学家应希望缺陷被发现，选 A discerned by 和 C discovered by。B disregarded 和 D ignored 是忽视，E opaque to 是对……不清楚，F inspiring to 是激励。"},
{"t":"Though Edmund certainly had a dignified bearing and made a great first impression, those who became acquainted with him soon realized he had an essentially _____ nature.","o":["A. pugnacious","B. deliberate","C. punctilious","D. courteous","E. complacent","F. truculent"],"translation":"尽管埃德蒙仪态庄重，给人的第一印象很好，但与他熟悉的人很快意识到，他本质上性情好斗。","grammar":"Though 引导让步从句，had 和 made 并列；主句主语是 those，who became acquainted with him 修饰 those，谓语是 realized；后面省略 that 的从句说明认识到的内容。","reason":"Though 提示外在好印象与真实本性形成反差；A pugnacious 和 F truculent 都表示好斗的。B deliberate 深思熟虑的，C punctilious 一丝不苟的，D courteous 有礼貌的，E complacent 自满的。"},
{"t":"Circulatory systems on organisms originated in widely separated epochs, according to the fossil record, and under a broad range of circumstances; the myriad forms they take attest to that _____ of origin.","o":["A. mysteriousness","B. randomness","C. ambiguity","D. heterogeneity","E. indeterminacy","F. diversity"],"translation":"根据化石记录，生物的循环系统起源于相距甚远的不同时代，以及各种各样的环境；它们呈现出的无数形态证明了这种起源的多样性。","grammar":"第一分句主干为 Circulatory systems ... originated ...；according to the fossil record 是插入语。第二分句主语是 the myriad forms，they take 是省略关系代词的定语从句，谓语 attest to。","reason":"widely separated epochs 和 broad range of circumstances 强调起源多样，选 D heterogeneity 和 F diversity。A 神秘，B 随机，C 模糊，E 不确定。原稿中使用 on organisms，此处保留原文。"}]

const starts=[10,12,14,17,20,22,25,27,29,31,33,36,38,40,42,44,46,48,50,52,54,56,58,60,62,64,66,68,70,72,74,76,78,80,82,84];
const keys=['E BF CDG BD DE BD EF','E BD BE AEG AC CE AF','E AD BDH AF BE BC AD','B B BD ADG AC AF DF','A AD AEI AF EF AB DE','D AE BD BFG BE CF DF','A BE BEI AD AF CF CE','A E AF CDH BF DF AB','A BD AEI AB BF BC AC','A CD BD BDI CF CE CE','A CF BDI AB AF AB BD','D CD CF BEI CD AB AF','D CE CEG BE AC CD AB','E C BF BFH BF CE AF','B CE AEH DF DE DF CF','A AF CD AEI DF BF DF','A AE CDH EF DE CF DF','C E BD BDH BD BE AF','C BE BDH AD CD AB AB','C AD CD CEH AC BD BE','E AD BFH BC BF DF BD','E AD CF ADI AE DF BF','B CF AEI BD BF AB BE','D BF CD AFG AD AE AB','C CD CEI CD CF DF BC','A BF CE CFI AC AC AC','B CE BDG DF AC BD BD','D AE BF AFI AB AB BE','D AD CEG BD DF CD DE','B CE AE CFH EF CE AF','B AE BEH CF AB CE BE','C CE CE BEG CE DF AD','B AF BDG BD AB AC CD','D CF AD CEI AE BE CF','D AE ADI CD CE AC AB'].map(x=>x.split(' '));
function optionLayout(n,i,q){let g=n===1?q.g:((n===2||n===3||n===4)&&i<(n%2?3:4)&&keys[n-1][i].length>1?Array.from({length:keys[n-1][i].length},(_,j)=>q.o.slice(j*3,j*3+3)):[q.o]);if(g.length<2)return `<div style="line-height:1.8">${g[0].join('<br>')}</div>`;return `<div class="option-grid" style="--cols:${g.length}">${g.map((col,j)=>`<div class="option-column"><div class="option-heading">空 ${j+1}</div>${col.map(option=>`<div>${option}</div>`).join('')}</div>`).join('')}</div>`}const storage='gre-sections-2-35-v1';let data;try{data=JSON.parse(localStorage.getItem(storage)||'{}')}catch{data={}}if(!data||typeof data!=='object')data={};let sec=2;const select=document.querySelector('#section');for(let n=2;n<=35;n++)select.add(new Option('Section '+n,n));select.onchange=()=>{sec=+select.value;showPractice();render()};function init(){return data[sec]??={answers:Array.from({length:7},()=>[]),submitted:false,firstScore:null,favorites:[]}}function save(){try{localStorage.setItem(storage,JSON.stringify(data));document.querySelector('#saved').textContent='已保存在当前浏览器'}catch{document.querySelector('#saved').textContent='保存失败，请立即下载备份'}}function type(i){return i<(sec%2?3:4)?'fill':'equiv'}function groups(i){let k=keys[sec-1][i];if(type(i)==='equiv')return ['ABCDEF'];if(k.length===1)return ['ABCDE'];return Array.from({length:k.length},(_,j)=>['ABC','DEF','GHI'][j])}function ok(i,s){return [...s.answers[i]].sort().join('')===[...keys[sec-1][i]].sort().join('')}function complete(i,s){return groups(i).every(g=>s.answers[i].filter(a=>g.includes(a)).length===(type(i)==='equiv'?2:1))}function render(){let s=init();let score=s.answers.filter((_,i)=>ok(i,s)).length;document.querySelector('#app').innerHTML=`<div class="card"><h1>Section ${sec}</h1><p>首次成绩：${s.firstScore===null?'尚未提交':s.firstScore+' / 7 · '+Math.round(s.firstScore/7*100)+'%'}</p><p id="saved"><small>记录保存在当前浏览器</small></p><details open><summary>原题页面（点击可收起）</summary><div class="images">${Array.from({length:starts[sec]-starts[sec-1]},(_,i)=>`<img loading="lazy" src="pages/p-${String(starts[sec-1]+1+i).padStart(3,'0')}.jpg" alt="Section ${sec} 原题第 ${i+1} 页">`).join('')}</div></details></div><div class="card"><h2>答题卡</h2>${keys[sec-1].map((k,i)=>`<div class="answer" style="display:block"><b>第 ${i+1} 题</b>${sec===2||sec===3||sec===4?`<div class="qtext" style="margin:12px 0;line-height:1.7">${(sec===2?section2:sec===3?section3:section4)[i].t}</div>${optionLayout(sec,i,(sec===2?section2:sec===3?section3:section4)[i])}<details style="margin:12px 0"><summary>查看句法分析（再次点击可收起）</summary><p>${(sec===2?section2:sec===3?section3:section4)[i].grammar}</p></details>`:""}<div class="tools">${groups(i).map((g,j)=>`<span>${groups(i).length>1?'空 '+(j+1)+'：':type(i)==='equiv'?'选两个：':''}${[...g].map(a=>`<label><input type="${type(i)==='equiv'?'checkbox':'radio'}" name="q${i}g${j}" data-i="${i}" value="${a}" ${s.answers[i].includes(a)?'checked':''} ${s.submitted?'disabled':''}>${a}</label>`).join('')}</span>`).join('')}${s.submitted?`<strong class="${ok(i,s)?'correct':'wrong'}">${ok(i,s)?'✓ 正确':'× 答错'} · 答案 ${k}</strong>`:''}${s.favorites.includes(i)?`<button data-remove="${i}">取消收藏</button>`:''}</div>${(sec===2||sec===3||sec===4)&&s.submitted?`<div class="note"><p><b>整句翻译：</b>${(sec===2?section2:sec===3?section3:section4)[i].translation}</p><p><b>答案解析：</b>${(sec===2?section2:sec===3?section3:section4)[i].reason}</p></div>`:''}</div>`).join('')}<div class="tools"><button class="primary" id="submit" ${s.submitted?'disabled':''}>提交 Section 并批改</button><button id="reset">重新开始</button></div>${s.submitted?`<p><strong>本次成绩：${score} / 7</strong></p>`:''}<p><small>首次答错自动收藏，之后答对不会移除；可手动取消收藏。</small></p></div>`;document.querySelectorAll('input[data-i]').forEach(el=>el.onchange=()=>{let i=+el.dataset.i,a=el.value;if(el.type==='checkbox'){if(el.checked&&s.answers[i].length>=2){el.checked=false;alert('请选择两个答案');return}s.answers[i]=el.checked?[...s.answers[i],a]:s.answers[i].filter(x=>x!==a)}else{let g=groups(i).find(g=>g.includes(a));s.answers[i]=s.answers[i].filter(x=>!g.includes(x)).concat(a)}save()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{s.favorites=s.favorites.filter(x=>x!==+b.dataset.remove);save();render()});document.querySelector('#submit').onclick=()=>{let missing=keys[sec-1].map((_,i)=>complete(i,s)?null:i+1).filter(Boolean);if(missing.length){alert('请完成第 '+missing.join('、')+' 题');return}if(s.firstScore===null){s.firstScore=s.answers.filter((_,i)=>ok(i,s)).length;s.answers.forEach((_,i)=>{if(!ok(i,s)&&!s.favorites.includes(i))s.favorites.push(i)})}s.submitted=true;save();render()};document.querySelector('#reset').onclick=()=>{if(confirm('重新开始此 Section？首次成绩和收藏会保留。')){s.answers=Array.from({length:7},()=>[]);s.submitted=false;save();render()}}}
function showPractice(){document.querySelector('#favoriteView').hidden=true;document.querySelector('#app').hidden=false;history.replaceState(null,'',location.pathname)}
function showFavorites(){let el=document.querySelector('#favoriteView');let state1;try{state1=JSON.parse(localStorage.getItem('gre-sec1-v1')||'{}')}catch{state1={}}let entries=[];(Array.isArray(state1.favorites)?state1.favorites:[]).filter(i=>Number.isInteger(i)&&i>=0&&i<7).forEach(i=>entries.push({n:1,i}));for(let n=2;n<=35;n++){let d=data[n];if(d&&Array.isArray(d.favorites))d.favorites.filter(i=>Number.isInteger(i)&&i>=0&&i<7).forEach(i=>entries.push({n,i}))}document.querySelector('#app').hidden=true;el.hidden=false;el.innerHTML=`<div class="card"><h1>收藏夹 · ${entries.length} 题</h1><p>首次提交时答错的题会自动收藏；只有手动取消才会移除。</p><p><small>收藏保存在当前浏览器。更换设备或浏览器时，请先恢复备份。</small></p><button id="backPractice">返回做题</button></div>${entries.length?entries.map(({n,i})=>{let q=n===1?section1Questions[i]:n===2?section2[i]:n===3?section3[i]:n===4?section4[i]:null;return `<article class="card"><h2>Section ${n} · 第 ${i+1} 题</h2>${q?`<p style="line-height:1.7">${q.t}</p>${optionLayout(n,i,q)}${n===2||n===3||n===4?`<details><summary>查看翻译和解析</summary><p><b>正确答案：${keys[n-1][i].split('').join(' / ')}</b></p><p>${q.translation}</p><p>${q.reason}</p><p>${q.grammar}</p></details>`:`<details><summary>查看答案和解析</summary><p><b>正确答案：${q.a.map(x=>x.join(' + ')).join(' / ')}</b></p><p>${q.e}</p></details>`}`:`<details><summary>查看答案</summary><p><b>正确答案：${keys[n-1][i].split('').join(' / ')}</b></p></details><p>此题在原书扫描页中，请展开对应 Section 原题并查看第 ${i+1} 题。</p><details><summary>查看原题扫描页</summary><div class="images">${Array.from({length:starts[n]-starts[n-1]},(_,j)=>`<img loading="lazy" src="pages/p-${String(starts[n-1]+1+j).padStart(3,'0')}.jpg" alt="Section ${n} 原题第 ${j+1} 页">`).join('')}</div></details>`}<p><button data-go="${n}" data-question="${i}">打开所在 Section</button> <button data-fav-remove="${n}" data-question="${i}">取消收藏</button></p></article>`}).join(''):'<div class="card">当前浏览器还没有收藏的题目。完成整组并提交后，首次答错的题会显示在这里。</div>'}`;document.querySelector('#backPractice').onclick=()=>{showPractice();render()};el.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{let n=+b.dataset.go;if(n===1){location.href='index.html';return}sec=n;select.value=String(n);showPractice();render();document.querySelectorAll('.answer')[+b.dataset.question]?.scrollIntoView({behavior:'smooth'})});el.querySelectorAll('[data-fav-remove]').forEach(b=>b.onclick=()=>{let n=+b.dataset.favRemove,i=+b.dataset.question;if(n===1){state1.favorites=state1.favorites.filter(x=>x!==i);localStorage.setItem('gre-sec1-v1',JSON.stringify(state1))}else{data[n].favorites=data[n].favorites.filter(x=>x!==i);localStorage.setItem(storage,JSON.stringify(data))}showFavorites()})}
document.querySelector('#favoriteList').onclick=()=>{history.replaceState(null,'','#favorites');showFavorites()};document.querySelector('#export').onclick=()=>{let blob=new Blob([JSON.stringify({format:'gre-all-v1',date:new Date().toISOString(),sections:data,section1:localStorage.getItem('gre-sec1-v1')},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='gre-sections-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.querySelector('#import').onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(v.format!=='gre-all-v1'||!v.sections||typeof v.sections!=='object'||Array.isArray(v.sections))throw Error();for(const [n,s] of Object.entries(v.sections)){if(+n<2||+n>35||!Array.isArray(s.answers)||s.answers.length!==7||!s.answers.every(a=>Array.isArray(a)&&a.every(x=>typeof x==='string'&&/^[A-I]$/.test(x)))||!Array.isArray(s.favorites)||typeof s.submitted!=='boolean'||!(s.firstScore===null||Number.isInteger(s.firstScore)))throw Error()}if(!confirm('恢复会覆盖当前浏览器的全部 Section 记录，继续吗？'))return;data=v.sections;if(v.section1)localStorage.setItem('gre-sec1-v1',v.section1);save();render();alert('备份已恢复')}catch{alert('备份无效，请选择此页面下载的备份文件')}finally{e.target.value=''}};render();if(location.hash==='#favorites')showFavorites();
