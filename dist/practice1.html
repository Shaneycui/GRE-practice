<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRE 填空练习</title><style>

e{color:#6b7e74;font-size:13px}.badge{background:#dbeee3;color:#286448;border-radius:50px;padding:5px 10px;font-size:12px}@media(max-width:600px){h1{font-size:29px}.card{padding:20px}.question{font-size:18px}header span{display:none}}
</style><style>body{background:#f6f7f3!important;color:#263b35!important;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif!important}header{background:#fff!important;color:#263b35!important;border-bottom:1px solid #dfe6de;position:sticky;top:0;z-index:5}main{max-width:1120px!important}.card{border:1px solid #dfe6de!important;border-radius:15px!important;box-shadow:0 4px 20px rgba(53,82,55,.035)}button,.upload,.secondary{border-radius:9px!important}button:hover{border-color:#6d9978!important}.note,.notice{background:#eff4eb!important;border:1px solid #e0eadd!important;color:#5c725b!important}.primary,#submit:not(:disabled){background:#28543f!important;color:white!important;border-color:#28543f!important}.qtext,.question{font-family:Georgia,"Times New Roman",serif;font-size:20px;line-height:1.8}.answer{padding:24px 0!important}.answer label{padding:10px!important;background:#fff}.answer label:has(input:checked){background:#e7f1e4;border-color:#6a9874}summary{color:#406a4b}.images img{border-radius:8px}a{color:#355e41}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #d8a85c;outline-offset:3px}@media(max-width:600px){.qtext,.question{font-size:18px}.card{padding:18px!important}}</style></head><body><header><strong>◒ &nbsp;GRE 填空练习</strong><span>FOCUS · PRACTICE · GROW</span></header><main class="wrap"><div class="eyebrow">MOCK TEST 01 / SECTION 01</div><h1>专注这一组题</h1><p class="intro">逐题完成，等整个 Section 提交后再一起查看结果。</p><div class="notice">第一阶段 · 已录入 Section 1 的 7 道题。答案已对照你提供的简易答案；中文解析为辅助整理。</div><div class="bar"><div><b>你的进度</b> <span id="count" class="subtle"></span></div><span class="badge">7 道题</span></div><div class="progress"><i id="progress"></i></div><div class="actions"><a class="secondary" href="index.html" style="display:inline-block;padding:13px;color:inherit">← 自习室首页</a><a class="secondary" href="sections.html" style="display:inline-block;padding:13px;border:1px solid #cbdcd0;border-radius:9px;background:white;color:inherit;text-decoration:none">选择 Section 2–35</a><button id="all" class="secondary">全部题目</button><button id="favorites" class="secondary">收藏夹 <span id="favcount"></span></button><button id="export" class="secondary">下载备份</button><label style="cursor:pointer;padding:13px;border:1px solid #cbdcd0;border-radius:9px;background:white">恢复备份<input id="import" type="file" accept="application/json" hidden></label></div><p class="subtle" id="saveStatus">记录自动保存在此浏览器，建议下载备份。</p><p id="firstScore" class="notice"></p><div id="summary"></div><div id="questions"></div><div class="actions"><button id="submit">提交 Section 并批改</button><button id="reset" class="secondary">重新开始</button></div><p class="subtle">作答记录保存在当前设备的浏览器中；清除浏览器数据或更换设备可能导致记录不可用。</p></main><script>
const qs=[
{t:'Scientists have argued not only that the chains of atoms called ladder compounds have _____ theoretical interest but also that studies of such systems can lead to important practical applications.',g:[['A. limited','B. dubious','C. superfluous','D. unidimensional','E. intrinsic']],a:[['E']],e:'not only … but also … 并列两种价值：自身的理论价值和重要的实际应用。intrinsic 表示“内在的、固有的”。'},
{t:'Although the vast weight of evidence supports the contention that the products of agricultural biotechnology are environmentally (i) _____, many people still find them (ii) _____ unsettling.',g:[['A. destructive','B. sound','C. intriguing'],['D. retroactively','E. innocuously','F. intrinsically']],a:[['B'],['F']],e:'Although 和 still 表示反差：证据表明对环境无害（sound），许多人仍觉得产品本身（intrinsically）令人不安。'},
{t:'It is possible for human to go 40 or more hours without sleep and still be able to (i) _____ information acquired at the beginning of the sleepless period. Thus, when we are considering a role for sleep in human memory consolidation, we are referring to a possible role in the (ii) _____ encoding of information and optimizing of recall, not a (iii) _____ of sleep for recalling events of the prior day.',g:[['A. legitimate','B. augment','C. disgorge'],['D. longer-term','E. acute','F. qualitative'],['G. requirement','H. surplus','I. facet']],a:[['C'],['D'],['G']],e:'即使不睡也能回忆信息（disgorge，此处指说出或回吐信息），所以睡眠不是回忆前一天事件的必要条件（requirement）；它可能有助于更长期的（longer-term）编码与优化回忆。'},
{t:'Not only is the advent of bookless or largely bookless libraries too large and powerful a change to be _____, it also offers too many real advantages for it to be considered a tragedy.',g:[['A. understood','B. averted','C. foreseen','D. forestalled','E. endured','F. anticipated']],a:[['B','D']],e:'too large and powerful … to be 表示变化太大、太强势，无法阻止。averted 和 forestalled 都有“防止、阻止”之意。'},
{t:'Although men still dominate the ranks of full professors in the field of astronomy, the increasing numbers of younger women in the field could _____ a change in its gender mix.',g:[['A. require','B. alleviate','C. block','D. presage','E. portend','F. hinder']],a:[['D','E']],e:'尽管目前男性仍占主导，年轻女性人数上升可能预示将来的性别构成发生变化。presage 和 portend 均表示“预示”。'},
{t:'The life of a secret agent is dangerous enough, but the life of a double agent is infinitely more _____: a single slip can send an agent crashing to destruction.',g:[['A. arduous','B. precarious','C. clandestine','D. perilous','E. covert','F. exhilarating']],a:[['B','D']],e:'冒号后解释：一个失误就可能导致毁灭，因此双重间谍更危险。precarious 意为危险的、不稳定的；perilous 意为危险的。'},
{t:'An apparent paradox led the scientists to pursue their present line of research. They were struck by the fact that a single mathematic formula can be used to describe physical phenomena that appear to be so _____.',g:[['A. rudimentary','B. interdependent','C. interrelated','D. complex','E. heterogeneous','F. dissimilar']],a:[['E','F']],e:'paradox 的反差是：一个公式能描述看似非常不同的现象。heterogeneous 和 dissimilar 都表示不同的、异质的。'}];
const analyses=["主句：Scientists have argued ...（科学家们认为……）。not only ... but also ... 连接 argued 的两个并列宾语从句；第一个从句的主语是 the chains of atoms，called ladder compounds 修饰 chains；第二个从句的主语是 studies of such systems。", "Although 引导让步状语从句：the vast weight of evidence 是主语，supports 是谓语；that 引导同位语从句，解释 contention 的内容。主句是 many people still find them ... unsettling：find + 宾语 + 形容词作宾补。", "第一句主干是 It is possible ... to go ... and still be able to ...；it 是形式主语，不定式是真正的主语。第二句中 when 引导时间状语从句；主句为 we are referring to a possible role ...，not a requirement ... 表示否定后一种理解。", "Not only 位于句首引起部分倒装：正常语序是 the advent ... is not only too large ...；too ... to ... 表示太……而不能……。第二个分句 it also offers ... 中 it 指这种变化。", "Although 引导让步从句，主语是 men，谓语是 dominate。主句主语是 the increasing numbers of younger women，谓语是 could + 空格，宾语是 a change。", "but 连接对比的两个分句，第二个分句的主语是 the life of a double agent。冒号后解释为什么更加危险；a single slip 是主语。", "第一句的主干是 An apparent paradox led the scientists to pursue ...。第二句 that 引导同位语从句，说明 fact 的内容；that appear to be so ... 是定语从句，修饰 physical phenomena。"];
let favoritesOnly=false;let state;try{state=JSON.parse(localStorage.getItem('gre-sec1-v1'))}catch{}if(!state||!Array.isArray(state.sel))state={sel:qs.map(q=>q.g.map(()=>[])),submitted:false};state.favorites=Array.isArray(state.favorites)?state.favorites:[];state.firstGraded=!!state.firstGraded;if(state.submitted&&!state.firstGraded){state.firstScore=0;qs.forEach((q,i)=>{let ok=q.a.every((a,j)=>a.length===state.sel[i][j].length&&a.every(x=>state.sel[i][j].includes(x)));if(ok)state.firstScore++;else if(!state.favorites.includes(i))state.favorites.push(i)});state.firstGraded=true;localStorage.setItem('gre-sec1-v1',JSON.stringify(state))}function save(){let payload=JSON.stringify(state);try{localStorage.setItem('gre-sec1-v1',payload);let h=JSON.parse(localStorage.getItem('gre-backups-v1')||'[]');h.push({time:new Date().toISOString(),data:state});localStorage.setItem('gre-backups-v1',JSON.stringify(h.slice(-20)));document.querySelector('#saveStatus').textContent='已自动保存至此浏览器 · '+new Date().toLocaleTimeString()+'。请下载备份文件以防数据丢失。'}catch(e){document.querySelector('#saveStatus').textContent='保存失败，请下载备份或检查浏览器存储设置。'}}function complete(i){return qs[i].a.every((a,j)=>state.sel[i][j].length===a.length)}function render(){let done=qs.filter((_,i)=>complete(i)).length;document.querySelector('#count').textContent=`${done} / ${qs.length} 题已完成`;document.querySelector('#progress').style.width=(done/qs.length*100)+'%';let correct=0;document.querySelector('#questions').innerHTML=qs.map((q,i)=>{let ok=q.a.every((a,j)=>a.length===state.sel[i][j].length&&a.every(x=>state.sel[i][j].includes(x)));if(ok)correct++;if(favoritesOnly&&!state.favorites.includes(i))return '';let groups=q.g.map((opts,j)=>`<div><div class="group-title">${q.g.length>1?'空格 '+['(i)','(ii)','(iii)'][j]:q.a[j].length===2?'选择两个答案':'选择一个答案'}</div>${opts.map(o=>{let letter=o[0];return `<label class="opt"><input ${state.submitted?'disabled':''} type="${q.a[j].length===2?'checkbox':'radio'}" name="q${i}g${j}" data-i="${i}" data-j="${j}" value="${letter}" ${state.sel[i][j].includes(letter)?'checked':''}><span>${o}</span></label>`}).join('')}</div>`).join('');return `<article class="card"><div class="label">QUESTION ${String(i+1).padStart(2,'0')} ${state.submitted?(ok?' · 正确':' · 需复习'):''}</div><div class="question" data-question="${i}">${q.t}</div><button class="secondary analyze" aria-expanded="false" data-question="${i}">分析选中内容 / 本题句子</button> ${state.favorites.includes(i)?`<button class="secondary removefav" data-question="${i}">取消收藏</button>`:''}<div class="analysis" id="analysis-${i}" hidden></div><div class="groups">${groups}</div>${state.submitted?`<div class="result ${ok?'':'wrong'}"><b>${ok?'✓ 正确':'× 未答对'}</b> · 参考答案：${q.a.map(x=>x.join(' + ')).join(' / ')}<br>${q.e}</div>`:''}</article>`}).join('');document.querySelector('#summary').innerHTML=state.submitted?`<div class="card"><div class="score">${correct} / ${qs.length} 答对</div><p>已完成本 Section。向下查看每题答案和解析。</p></div>`:'';document.querySelector('#submit').hidden=state.submitted||favoritesOnly;let otherFavorites={};try{otherFavorites=JSON.parse(localStorage.getItem('gre-sections-2-35-v1')||'{}')}catch{}document.querySelector('#favcount').textContent='('+(state.favorites.length+Object.values(otherFavorites||{}).reduce((sum,x)=>sum+(Array.isArray(x?.favorites)?x.favorites.length:0),0))+')';document.querySelector('#firstScore').textContent=state.firstGraded?'首次成绩：'+state.firstScore+' / '+qs.length+' · '+Math.round(state.firstScore/qs.length*100)+'%':'首次成绩：尚未提交';document.querySelectorAll('.analyze').forEach(b=>b.onclick=()=>{let i=+b.dataset.question;let selected=window.getSelection().toString().trim();let box=document.querySelector('#analysis-'+i);if(!box.hidden){box.hidden=true;b.setAttribute('aria-expanded','false');return}box.hidden=false;b.setAttribute('aria-expanded','true');box.className='result';box.textContent=(selected&&qs[i].t.includes(selected)?'选中：'+selected+'。 ':'')+analyses[i]});document.querySelectorAll('.removefav').forEach(b=>b.onclick=()=>{state.favorites=state.favorites.filter(x=>x!==+b.dataset.question);save();render()});document.querySelectorAll('input').forEach(el=>el.onchange=()=>{let i=+el.dataset.i,j=+el.dataset.j;if(el.type==='radio')state.sel[i][j]=[el.value];else{let a=state.sel[i][j];if(el.checked){if(a.length>=2){el.checked=false;alert('本题请选择两个答案。');return}a.push(el.value)}else state.sel[i][j]=a.filter(x=>x!==el.value)}save();render()})}document.querySelector('#submit').onclick=()=>{let missing=qs.map((_,i)=>complete(i)?null:i+1).filter(x=>x!==null);if(missing.length){alert('请先完成所有题目。未完成：第 '+missing.join('、')+' 题。');return}if(!state.firstGraded){state.firstScore=0;qs.forEach((q,i)=>{let ok=q.a.every((a,j)=>a.length===state.sel[i][j].length&&a.every(x=>state.sel[i][j].includes(x)));if(ok)state.firstScore++;else if(!state.favorites.includes(i))state.favorites.push(i)});state.firstGraded=true}state.submitted=true;save();render();document.querySelector('#summary').scrollIntoView({behavior:'smooth'})};document.querySelector('#reset').onclick=()=>{if(confirm('确定清除本 Section 的作答并重新开始吗？')){state={...state,sel:qs.map(q=>q.g.map(()=>[])),submitted:false};save();render();window.scrollTo({top:0,behavior:'smooth'})}};document.querySelector('#all').onclick=()=>{favoritesOnly=false;render()};document.querySelector('#favorites').onclick=()=>{location.href='sections.html#favorites'};document.querySelector('#export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='gre-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.querySelector('#import').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());let d=x.state;if(x.version!==1||!d||!Array.isArray(d.sel)||d.sel.length!==qs.length||!d.sel.every((g,i)=>Array.isArray(g)&&g.length===qs[i].g.length&&g.every(a=>Array.isArray(a)&&a.every(x=>typeof x==='string')))||!Array.isArray(d.favorites)||typeof d.firstGraded!=='boolean')throw Error();if(!confirm('恢复备份会覆盖当前浏览器中的进度和收藏，继续吗？'))return;state=d;save();render();alert('备份已恢复。')}catch{alert('无法读取备份，请选择此网站导出的备份文件。')}finally{e.target.value=''}};render();
</script></body></html>
